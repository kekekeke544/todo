<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Todo · 我的清单</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ═══════════════════════════════════════════
   DESIGN SYSTEM — Warm, Refined, Delightful
   Inspired by Linear / Notion / Things 3
   ═══════════════════════════════════════════ */

:root{
  /* Core surfaces — warm off-white, easier on eyes */
  --bg:#edebe7;
  --sb:#e5e3dd;
  --sb-hover:#dddbd4;
  --sb-active:#d3d0c8;

  /* Text hierarchy — slightly softer */
  --text:#2c2c3a;
  --t2:#6b6b82;
  --t3:#9c9cb4;

  /* Borders & hover */
  --border:#dddbd5;
  --hover:#eeedea;

  /* Accent — muted warm violet */
  --accent:#7d6b8a;
  --accent-light:#a498b0;
  --accent-soft:rgba(125,107,138,.1);

  /* Priority palette — Morandi tones, warm & muted */
  --high:#b33a3a;
  --high-bg:#f5e8e7;
  --mid:#8b6530;
  --mid-bg:#f3ede4;
  --low:#3d7a50;
  --low-bg:#e8f0ea;
  --none:#7a7f8c;
  --none-bg:#eeeff1;

  /* Radii */
  --r:10px;
  --r-sm:8px;
  --r-lg:14px;

  /* Typography */
  --font:'Inter',-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;

  /* Shadows */
  --shadow-xs:0 1px 2px rgba(0,0,0,.04);
  --shadow-sm:0 2px 8px rgba(0,0,0,.06);
  --shadow-md:0 4px 16px rgba(0,0,0,.08);
  --shadow-lg:0 8px 32px rgba(0,0,0,.12);

  /* Glass & gradient */
  --glass:rgba(255,255,255,.65);
  --glass-border:rgba(255,255,255,.4);
  --gradient-accent:linear-gradient(135deg,#7d6b8a 0%,#9b8ea8 50%,#8a7fa0 100%);
  --gradient-warm:linear-gradient(180deg,#e5e3dd 0%,#dedcd5 100%);
}

/* ──────── DARK MODE ──────── */
body.dark{
  --bg:#191927;
  --sb:#1c1c2e;
  --sb-hover:#24243a;
  --sb-active:#2c2c46;
  --text:#e4e4f0;
  --t2:#9494b0;
  --t3:#606080;
  --border:#282840;
  --hover:#1e1e32;
  --accent:#a498b8;
  --accent-light:#b8aec8;
  --accent-soft:rgba(164,152,184,.15);
  --high:#e87070;
  --high-bg:rgba(232,112,112,.15);
  --mid:#d4a54a;
  --mid-bg:rgba(212,165,74,.14);
  --low:#5cc07a;
  --low-bg:rgba(92,192,122,.14);
  --none:#8888a0;
  --none-bg:rgba(136,136,160,.14);
  --shadow-xs:0 1px 2px rgba(0,0,0,.25);
  --shadow-sm:0 2px 8px rgba(0,0,0,.3);
  --shadow-md:0 4px 16px rgba(0,0,0,.35);
  --shadow-lg:0 8px 32px rgba(0,0,0,.45);
  --glass:rgba(25,25,39,.82);
  --glass-border:rgba(255,255,255,.06);
  --gradient-warm:linear-gradient(180deg,#1c1c2e 0%,#1a1a28 100%);
}
body.dark .ws-icon{background:var(--gradient-accent)}
body.dark .rich-toolbar,body.dark .rich-editor{background:#1a1a2a;border-color:var(--border)}
body.dark .rich-btn{color:var(--t2)}
body.dark .rich-btn:hover{background:var(--sb-active);color:var(--text)}
body.dark .rich-editor{color:#ddd}
body.dark .sb-rich-toolbar{background:var(--sb);border-color:var(--border)}
body.dark .modal{background:#20203a;color:var(--text);border:1px solid var(--border)}
body.dark .modal input[type="text"],body.dark .modal textarea,body.dark .modal select{background:#1a1a2c;color:var(--text);border-color:var(--sb-active)}
body.dark .overlay{background:rgba(0,0,0,.55);backdrop-filter:blur(10px)}
body.dark .dt-popup,body.dark .prio-dropdown,body.dark .list-sel-dd,body.dark .repeat-dd,body.dark .custom-repeat-panel{background:#20203a;border-color:var(--sb-active);box-shadow:var(--shadow-lg)}
body.dark .prio-opt:hover,body.dark .list-sel-opt:hover,body.dark .repeat-opt:hover{background:var(--sb-hover)}
body.dark .time-slot:hover{background:var(--sb-hover);color:var(--text)}
body.dark .time-slot.selected{background:var(--accent);color:#fff}
body.dark .note-card{background:#1e1e32;border-color:var(--border)}
body.dark .note-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.4);border-color:var(--sb-active)}
body.dark .header-bg-panel{background:#20203a;border-color:var(--sb-active)}
body.dark .hbp-upload-btn{border-color:var(--sb-active);color:var(--t2)}
body.dark .hbp-upload-btn:hover{border-color:var(--accent);color:var(--accent)}
body.dark .chip{border-color:var(--sb-active);color:var(--t2)}
body.dark .chip:hover{background:var(--sb-hover);color:var(--text);border-color:var(--t3)}
body.dark .chip.active{background:var(--gradient-accent);color:#fff;border-color:transparent}
body.dark .add-bar{background:var(--bg);border-color:var(--sb-active);box-shadow:var(--shadow-sm)}
body.dark .add-bar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-sm)}
body.dark .add-task-input{color:var(--text);background:transparent}
body.dark .add-btn{background:var(--gradient-accent);color:#fff}
body.dark .t-check{border-color:#44446a}
body.dark .t-check:hover{border-color:var(--accent-light);box-shadow:0 0 0 3px var(--accent-soft)}
body.dark .t-check.checked{background:var(--accent);border-color:var(--accent)}
body.dark .task-item:hover{background:var(--hover)}
body.dark .task-item+.task-item{border-top-color:var(--border)}
body.dark .task-item:hover+.task-item{border-top-color:transparent}
body.dark .sp-ctx-menu{background:#20203a;border-color:var(--sb-active);box-shadow:var(--shadow-lg)}
body.dark .sp-ctx-item:hover{background:var(--sb-hover)}
body.dark .goals-month-block{background:var(--bg);border-color:var(--border)}
body.dark .goals-ng-item:hover{background:var(--hover)}
body.dark .note-rtb{background:var(--hover);border-color:var(--border)}
body.dark .note-body-editor{color:var(--text)}
body.dark .note-toolbar button{color:var(--t2)}
body.dark .sb-resizer:hover,body.dark .sb-resizer.sb-resizing{background:var(--accent)}
body.dark .wk-day-block{border-color:var(--border)}
body.dark .wk-day-hd{background:var(--hover)}
body.dark .wk-day-block.today .wk-day-hd{background:var(--accent)}
body.dark .wk-day-block.today .wk-day-hd *{color:#fff!important}
body.dark .wk-task-row:hover{background:var(--hover)}
body.dark .wk-task-row{border-top-color:var(--border)}

/* ──────── TAG PILLS ──────── */
.t-tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:500;margin-right:3px;background:linear-gradient(135deg,#f0ecff,#ede4fb);color:#6b21a8;white-space:nowrap;transition:all .15s}
.t-tag:hover{transform:translateY(-1px);box-shadow:var(--shadow-xs)}
body.dark .t-tag{background:linear-gradient(135deg,#2d1f3d,#301f42);color:#c4b5fd}
body.dark .tag-repeat{background:rgba(100,80,130,.2);color:#b0a0c0;border:1px solid rgba(140,120,170,.15)}
body.dark .tag{font-weight:600}
body.dark .tag-high{background:rgba(232,112,112,.16);color:#e8a0a0}
body.dark .tag-mid{background:rgba(212,165,74,.15);color:#d4c090}
body.dark .tag-low{background:rgba(92,192,122,.15);color:#90c8a0}
body.dark .tag-none{background:rgba(136,136,160,.15);color:#a0a0b8}
body.dark .tag-date{color:#9494b0}
body.dark .tag-date.overdue{color:#fca5a5;font-weight:600}
body.dark .tag-list{color:#9494b0}
body.dark .t-prio-inline{opacity:1}

/* ──────── SIDEBAR BOTTOM ──────── */
.sb-bottom{border-top:1px solid var(--border);padding:10px 12px;flex-shrink:0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sb-bottom-btn{background:none;border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 12px;font-size:12px;font-family:var(--font);color:var(--t2);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px}
.sb-bottom-btn:hover{background:var(--sb-hover);color:var(--text);border-color:var(--t3);transform:translateY(-1px);box-shadow:var(--shadow-xs)}

/* Dark mode toggle */
.dark-toggle{background:none;border:none;cursor:pointer;font-size:16px;padding:6px 8px;border-radius:var(--r-sm);color:var(--t2);transition:all .2s;line-height:1}
.dark-toggle:hover{background:var(--sb-hover);color:var(--text);transform:scale(1.1)}

/* Tag filter chip */
.tag-filter-chip{padding:3px 10px;border-radius:14px;font-size:11.5px;border:1px solid var(--border);cursor:pointer;background:transparent;color:var(--t2);transition:all .2s;user-select:none;font-family:var(--font)}
.tag-filter-chip:hover{background:var(--sb-hover);color:var(--text);border-color:var(--t3);transform:translateY(-1px)}
.tag-filter-chip.active{background:linear-gradient(135deg,#ede4fb,#e8ddf9);color:#6b21a8;border-color:#c4b5fd;box-shadow:0 1px 4px rgba(107,33,168,.12)}
body.dark .tag-filter-chip.active{background:linear-gradient(135deg,#2d1f3d,#301f42);color:#c4b5fd;border-color:#6b21a8}

/* ──────── BODY ──────── */
body{font-family:var(--font);background:var(--bg);display:flex;height:100vh;overflow:hidden;color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}

/* ── SIDEBAR ── */
.sidebar{width:280px;background:var(--gradient-warm);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 0 12px;flex-shrink:0;overflow:hidden;position:relative}
.sb-resizer{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:10;background:transparent;transition:background .15s}
.sb-resizer:hover,.sb-resizer.sb-resizing{background:var(--accent);opacity:.5;border-radius:3px}
body.sb-resizing-active{cursor:col-resize;user-select:none}
body.sb-resizing-active .sidebar{transition:none}
.ws{display:flex;align-items:center;gap:8px;padding:4px 14px 14px;font-weight:700;font-size:14px;border-bottom:1px solid var(--border);margin-bottom:6px}
.ws-icon{width:30px;height:30px;background:var(--gradient-accent);color:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;box-shadow:0 2px 8px rgba(108,99,255,.3)}
.sb-sec{font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--t3);padding:10px 14px 3px;text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:13.5px;color:var(--t2);transition:all .18s ease;user-select:none;border-radius:var(--r-sm);margin:1px 6px}
.sb-item:hover{background:var(--sb-hover);color:var(--text);transform:translateX(2px)}
.sb-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.sb-item .si{font-size:15px;width:20px;text-align:center;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sb-item .sc{margin-left:auto;font-size:11px;color:var(--t3);background:var(--sb-active);border-radius:10px;padding:0 6px;min-width:18px;text-align:center;display:none;font-weight:500}
.sb-item .sc.visible{display:block}
.sb-item.active .sc{color:var(--accent);background:var(--accent-soft)}

.sb-lists{padding:0 8px;overflow-y:auto;max-height:200px;flex-shrink:0}
.sb-list-item{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 12px;cursor:pointer;font-size:13.5px;color:var(--t2);transition:all .18s ease;user-select:none;border-radius:var(--r-sm);margin:1px 6px}
.sb-list-item:hover{background:var(--sb-hover);color:var(--text);transform:translateX(2px)}
.sb-list-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.sb-list-item.list-drag-over{border-top:2px solid var(--accent)}
.sb-list-item .li-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.sb-list-item .li-cnt{margin-left:auto;font-size:11px;color:var(--t3);flex-shrink:0}
.sb-list-item .li-edit-btn{opacity:0;background:none;border:none;font-size:0;color:var(--t3);cursor:pointer;padding:2px 4px;border-radius:4px;line-height:1;transition:opacity .15s;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sb-list-item:hover .li-edit-btn{opacity:1}
.sb-list-item .li-edit-btn:hover{color:var(--text);background:var(--sb-active)}

.new-list-btn{margin:4px 10px 0;padding:6px 10px;background:transparent;border:none;color:var(--t3);border-radius:var(--r-sm);cursor:pointer;font-size:13px;font-family:var(--font);transition:all .18s;display:flex;align-items:center;gap:6px;width:calc(100% - 20px)}
.new-list-btn:hover{background:var(--sb-hover);color:var(--t2)}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.header{padding:24px 44px 0;flex-shrink:0;position:relative;background-size:cover;background-position:center;border-radius:0 0 var(--r-lg) var(--r-lg);transition:all .3s ease}
.header-has-bg{padding-bottom:24px}
.header-bg-btn{position:absolute;top:12px;right:12px;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:var(--r-sm);padding:5px 12px;font-size:11px;color:var(--text);cursor:pointer;opacity:0;transition:all .2s;display:flex;align-items:center;gap:5px;font-family:var(--font)}
.header:hover .header-bg-btn{opacity:1}
.header-bg-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.header-bg-panel{position:absolute;top:40px;right:12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);z-index:300;padding:16px 18px;width:280px;display:none}
.header-bg-panel.open{display:block}
.hbp-label{font-size:11px;color:var(--t3);font-weight:600;margin-bottom:8px;letter-spacing:.03em}
.hbp-colors{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.hbp-color{width:28px;height:28px;border-radius:var(--r-sm);cursor:pointer;border:2px solid transparent;transition:all .2s}
.hbp-color:hover,.hbp-color.active{border-color:var(--accent);transform:scale(1.12);box-shadow:0 2px 8px rgba(108,99,255,.2)}
.hbp-upload-row{display:flex;gap:8px;align-items:center}
.hbp-upload-btn{flex:1;border:1.5px dashed var(--border);border-radius:var(--r-sm);padding:8px;font-size:12px;color:var(--t3);text-align:center;cursor:pointer;font-family:var(--font);background:none;transition:all .2s}
.hbp-upload-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.hbp-clear{border:1px solid var(--border);background:none;border-radius:var(--r-sm);padding:8px 14px;font-size:12px;color:var(--t3);cursor:pointer;font-family:var(--font);transition:all .2s}
.hbp-clear:hover{color:var(--high);border-color:var(--high);background:var(--high-bg)}

/* Header title — gradient text effect */
.header h1{font-size:30px;font-weight:800;letter-spacing:-.03em;background:var(--gradient-accent);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header .meta{font-size:13px;color:var(--t3);margin-top:4px;font-weight:500;letter-spacing:.01em}
/* Motto — card wrap with accent left border */
.header .motto{font-size:14px;font-weight:500;margin-top:10px;font-style:italic;line-height:1.6;color:var(--t2);background:var(--accent-soft);padding:8px 14px;border-radius:var(--r-sm);border-left:3px solid var(--accent);display:inline-block}

/* ── ADD BAR ── */
.add-wrap{padding:16px 44px 0;flex-shrink:0}
.add-wrap.hidden{display:none}
.add-bar{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:var(--r-lg);background:#fff;transition:all .25s ease;gap:0;box-shadow:var(--shadow-xs)}
.add-bar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-sm);transform:translateY(-1px)}
.add-plus{padding:0 10px 0 16px;color:var(--accent);font-size:20px;flex-shrink:0;line-height:1;font-weight:300}
.add-task-input{flex:1;border:none;outline:none;font-size:14px;font-family:var(--font);background:transparent;color:var(--text);padding:12px 8px 12px 0;min-width:0}
.add-task-input::placeholder{color:var(--t3)}
.add-sep{width:1px;height:22px;background:var(--border);flex-shrink:0;opacity:.5}

/* ── 优先级自定义下拉 ── */
.prio-wrapper{position:relative;flex-shrink:0}
.prio-trigger{display:flex;align-items:center;gap:5px;padding:0 12px;height:44px;cursor:pointer;font-size:13px;color:var(--t2);user-select:none;white-space:nowrap;transition:color .15s}
.prio-trigger:hover{color:var(--text)}
.prio-trigger .prio-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.prio-dropdown{position:absolute;top:calc(100% + 6px);left:0;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);z-index:200;min-width:120px;padding:6px 0;display:none}
.prio-dropdown.open{display:block}
.prio-opt{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;font-size:13px;color:var(--text);transition:all .15s;border-radius:var(--r-sm);margin:0 4px}
.prio-opt:hover{background:var(--sb-hover)}
.prio-opt .prio-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.prio-opt.selected{background:var(--accent-soft);color:var(--accent)}

/* ── 日期按钮 ── */
.dt-wrapper{position:relative;flex-shrink:0}
.dt-trigger{display:flex;align-items:center;gap:5px;padding:0 12px;height:44px;cursor:pointer;font-size:13px;color:var(--t2);user-select:none;white-space:nowrap;transition:color .15s}
.dt-trigger:hover{color:var(--text)}
.dt-trigger .dt-icon{font-size:16px;line-height:1;display:flex;align-items:center}
.dt-trigger .dt-label{font-size:12.5px;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.dt-popup{position:absolute;top:calc(100% + 6px);right:0;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);z-index:200;padding:16px 18px;display:none;min-width:420px}
.dt-popup.open{display:block}
.dt-popup label{font-size:11.5px;color:var(--t3);display:block;margin-bottom:5px;font-weight:600;letter-spacing:.02em}
.dt-popup input[type="date"]{width:100%;border:1.5px solid var(--border);border-radius:var(--r-sm);padding:8px 10px;font-size:13px;font-family:var(--font);outline:none;color:var(--text);margin-bottom:10px;transition:border-color .2s}
.dt-popup input[type="date"]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.time-scroller{display:flex;gap:8px;margin-bottom:10px;height:160px}
.time-col{flex:1;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r-sm);scroll-snap-type:y mandatory}
.time-col::-webkit-scrollbar{width:0}
.time-slot{height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--t2);cursor:pointer;scroll-snap-align:start;transition:all .15s;user-select:none;border-radius:4px;margin:1px}
.time-slot:hover{background:var(--sb-hover);color:var(--text)}
.time-slot.selected{background:var(--accent);color:#fff;font-weight:600;border-radius:var(--r-sm);box-shadow:0 2px 6px rgba(108,99,255,.25)}
.time-col-label{font-size:11px;color:var(--t3);text-align:center;margin-bottom:3px;font-weight:500}
.dt-actions{display:flex;gap:6px;justify-content:flex-end}
.dt-actions button{padding:6px 14px;border-radius:var(--r-sm);border:none;font-size:12.5px;font-family:var(--font);cursor:pointer;font-weight:600;transition:all .2s}
.dt-clear{background:var(--sb-hover);color:var(--t2)}
.dt-clear:hover{background:var(--sb-active)}
.dt-ok{background:var(--accent);color:#fff;box-shadow:0 2px 6px rgba(108,99,255,.2)}
.dt-ok:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(108,99,255,.3)}

/* ── 清单选择 ── */
.list-sel-wrap{position:relative;flex-shrink:0}
.list-sel-trigger{display:flex;align-items:center;gap:5px;padding:0 10px;height:44px;cursor:pointer;font-size:13px;color:var(--t2);user-select:none;white-space:nowrap;max-width:100px;overflow:hidden;transition:color .15s}
.list-sel-trigger:hover{color:var(--text)}
.list-sel-trigger .ls-icon{font-size:14px;flex-shrink:0}
.list-sel-trigger .ls-name{overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.list-sel-dd{position:absolute;top:calc(100% + 6px);right:0;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);z-index:200;padding:6px 0;display:none;min-width:130px}
.list-sel-dd.open{display:block}
.list-sel-opt{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;font-size:13px;color:var(--text);transition:all .15s;border-radius:var(--r-sm);margin:0 4px}
.list-sel-opt:hover{background:var(--sb-hover)}
.list-sel-opt.selected{background:var(--accent-soft);color:var(--accent)}

/* ── 循环选择 ── */
.repeat-wrap{position:relative;flex-shrink:0}
.repeat-trigger{display:flex;align-items:center;gap:4px;padding:0 10px;height:44px;cursor:pointer;font-size:13px;color:var(--t2);user-select:none;white-space:nowrap;transition:color .15s}
.repeat-trigger:hover{color:var(--text)}
.repeat-trigger .rpt-icon{font-size:14px;display:flex;align-items:center}
.repeat-trigger .rpt-label{font-size:12px}
.repeat-dd{position:absolute;top:calc(100% + 6px);right:0;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);z-index:200;padding:6px 0;display:none;min-width:130px}
.repeat-dd.open{display:block}
.repeat-opt{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;font-size:13px;color:var(--text);transition:all .15s;border-radius:var(--r-sm);margin:0 4px}
.repeat-opt:hover{background:var(--sb-hover)}
.repeat-opt.selected{background:var(--accent-soft);color:var(--accent)}

.custom-repeat-panel{position:absolute;top:calc(100% + 6px);right:0;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);z-index:200;padding:16px 18px;display:none;min-width:260px}
.custom-repeat-panel.open{display:block}
.crp-label{font-size:11.5px;color:var(--t3);font-weight:600;margin-bottom:6px}
.crp-unit-row{display:flex;gap:6px;margin-bottom:10px}
.crp-unit-btn{flex:1;padding:6px 4px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:12.5px;text-align:center;cursor:pointer;color:var(--t2);transition:all .15s;background:transparent;font-family:var(--font)}
.crp-unit-btn:hover{border-color:var(--t3);color:var(--text)}
.crp-unit-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
.crp-num-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.crp-num{width:28px;height:28px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:12px;text-align:center;line-height:28px;cursor:pointer;color:var(--t2);transition:all .15s}
.crp-num:hover{border-color:var(--t3);color:var(--text)}
.crp-num.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.crp-week-row{display:flex;gap:4px;margin-bottom:10px}
.crp-wd{width:30px;height:30px;border:1px solid var(--border);border-radius:50%;font-size:11.5px;text-align:center;line-height:30px;cursor:pointer;color:var(--t2);transition:all .15s}
.crp-wd:hover{border-color:var(--t3);color:var(--text)}
.crp-wd.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 6px rgba(108,99,255,.2)}
.crp-actions{display:flex;gap:6px;justify-content:flex-end}
.crp-actions button{padding:6px 14px;border-radius:var(--r-sm);border:none;font-size:12.5px;font-family:var(--font);cursor:pointer;font-weight:600;transition:all .2s}
.crp-row{display:flex;align-items:center;gap:8px}
.crp-label-inline{font-size:12px;color:var(--t3);flex-shrink:0}
.crp-n-input{width:52px;border:1.5px solid var(--border);border-radius:var(--r-sm);padding:5px 8px;font-size:13px;font-family:var(--font);outline:none;text-align:center;transition:border-color .2s}
.crp-n-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.crp-unit-sel{border:1.5px solid var(--border);border-radius:var(--r-sm);padding:5px 8px;font-size:13px;font-family:var(--font);outline:none;background:var(--bg);cursor:pointer;transition:border-color .2s}
.crp-unit-sel:focus{border-color:var(--accent)}
.crp-end-date{flex:1;border:1.5px solid var(--border);border-radius:var(--r-sm);padding:5px 8px;font-size:12px;font-family:var(--font);outline:none;color:var(--text);transition:border-color .2s}
.crp-end-date:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* Add button — gradient accent */
.add-btn{margin:5px 6px 5px 4px;background:var(--gradient-accent);color:#fff;border:none;border-radius:var(--r-sm);padding:8px 20px;font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0;box-shadow:0 2px 8px rgba(108,99,255,.25)}
.add-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(108,99,255,.35)}
.add-btn:active{transform:translateY(0);box-shadow:0 1px 4px rgba(108,99,255,.2)}

/* ── FILTERS ── */
.filters{padding:12px 44px 0;display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0}
.chip{padding:5px 14px;border-radius:20px;font-size:12.5px;border:1px solid var(--border);cursor:pointer;background:transparent;color:var(--t2);transition:all .2s ease;user-select:none;font-family:var(--font);font-weight:500}
.chip:hover{background:var(--sb-hover);color:var(--text);border-color:var(--t3);transform:translateY(-1px)}
.chip.active{background:var(--gradient-accent);color:#fff;border-color:transparent;font-weight:600;box-shadow:0 2px 8px rgba(108,99,255,.25)}
.divider{margin:12px 44px 0;height:1px;background:var(--border);flex-shrink:0;opacity:.6}

/* ── TASK LIST ── */
.task-list{overflow-y:auto;padding:8px 44px 40px}
.task-list,.notes-wrap{flex:1}

.section-label{font-size:11.5px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;padding:16px 0 6px}

/* Task items — card-like feel with hover lift */
.task-item{display:flex;align-items:flex-start;gap:10px;padding:10px 10px 10px 8px;border-radius:var(--r);transition:all .2s ease;cursor:default;margin:3px 0;background:#fff;box-shadow:var(--shadow-xs)}
.task-item:hover{background:#fff;box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.task-item+.task-item{border-top:none}
.task-item:hover+.task-item{border-top-color:transparent}
.task-item.done-item{opacity:.45}

/* Checkbox — animated ring */
.t-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--t3);cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .25s cubic-bezier(.4,.0,.2,1);font-size:10px;color:#fff}
.t-check:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);transform:scale(1.1)}
.t-check.checked{background:var(--accent);border-color:var(--accent);box-shadow:0 2px 6px rgba(108,99,255,.3);animation:checkPop .3s ease}
@keyframes checkPop{
  0%{transform:scale(1)}
  50%{transform:scale(1.2)}
  100%{transform:scale(1)}
}

.t-body{flex:1;min-width:0}
.t-title{font-size:14px;font-weight:600;color:var(--text);line-height:1.55;word-break:break-word}
.task-item.done-item .t-title{text-decoration:line-through;color:var(--t3)}
.t-body-preview{font-size:12px;color:var(--t3);margin-top:2px;line-height:1.5;white-space:pre-wrap;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.t-title-input{font-size:14px;font-family:var(--font);border:none;outline:none;background:transparent;color:var(--text);width:100%;border-bottom:1.5px solid var(--accent);padding:1px 0}
.t-meta{display:flex;gap:6px;margin-top:4px;align-items:center;flex-wrap:wrap}

/* Priority tags — pill style */
.tag{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600;display:flex;align-items:center;gap:3px}
.tag .td{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.tag-high{background:var(--high-bg);color:var(--high)}
.tag-mid{background:var(--mid-bg);color:var(--mid)}
.tag-low{background:var(--low-bg);color:var(--low)}
.tag-none{background:var(--none-bg);color:var(--none)}
.tag-date{font-size:12px;color:var(--t3);display:flex;align-items:center;gap:3px}
.tag-date.overdue{color:#b33a3a;font-weight:600;background:#f5e8e7;padding:2px 8px;border-radius:6px}
.tag-list{font-size:11.5px;color:var(--t3)}
.tag-repeat{font-size:11px;color:#7a6b8a;background:#eee9f0;padding:2px 7px;border-radius:6px;display:flex;align-items:center;gap:2px}

/* Inline priority label */
.t-title-row{display:flex;align-items:center;gap:6px;min-width:0}
.t-title-row .t-title{flex:1;min-width:0}
.t-prio-inline{font-size:10.5px;font-weight:700;flex-shrink:0;white-space:nowrap;padding:2px 8px;border-radius:6px;line-height:1.6;border:1px solid transparent;letter-spacing:.02em}
.t-actions{display:flex;gap:2px;flex-shrink:0;opacity:0;transition:opacity .15s}
.task-item:hover .t-actions{opacity:1}
.t-btn{background:none;border:none;color:var(--t3);cursor:pointer;font-size:13px;padding:3px 5px;border-radius:4px;line-height:1;transition:all .15s}
.t-btn:hover{color:var(--text);background:var(--sb-active)}
.t-btn.del:hover{color:var(--high);background:var(--high-bg)}
.t-act-btn{background:none;border:none;cursor:pointer;color:var(--t3);padding:5px 6px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;transition:all .2s}
.t-act-btn:hover{background:var(--sb-hover);color:var(--text);transform:scale(1.05)}
.t-act-btn.t-act-del:hover{color:var(--high);background:var(--high-bg)}

/* ── EMPTY ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 0;color:var(--t3);gap:8px}
.empty .ei{font-size:36px;opacity:.3;margin-bottom:4px}
.empty .et{font-size:14px;font-weight:600;color:var(--t2)}
.empty .es{font-size:13px}

/* ── MODALS — enhanced glass effect ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:500;backdrop-filter:blur(8px)}
.modal{background:var(--bg);border-radius:var(--r-lg);padding:28px;width:400px;box-shadow:var(--shadow-lg),0 0 0 1px var(--border)}
.modal h2{font-size:17px;font-weight:700;margin-bottom:18px;letter-spacing:-.01em}
.modal label{font-size:12.5px;color:var(--t2);display:block;margin-bottom:5px;font-weight:600}
.modal input[type="text"],.modal textarea,.modal select{width:100%;border:1.5px solid var(--border);border-radius:var(--r);padding:10px 12px;font-size:14px;font-family:var(--font);outline:none;color:var(--text);transition:all .2s;margin-bottom:14px;background:var(--bg)}
.modal textarea{resize:vertical;min-height:90px}
.modal input[type="text"]:focus,.modal textarea:focus,.modal select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.icon-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:14px}
.icon-opt{width:32px;height:32px;border-radius:50% !important;border:3px solid transparent;cursor:pointer;transition:all .2s;transform:scale(0.85)}
.icon-opt:hover{transform:scale(1)}
.icon-opt.selected{transform:scale(1);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.modal-actions button{padding:8px 18px;border-radius:var(--r-sm);border:none;cursor:pointer;font-size:13.5px;font-family:var(--font);font-weight:600;transition:all .2s}
.btn-cancel{background:var(--sb-hover);color:var(--t2)}
.btn-cancel:hover{background:var(--sb-active)}
.btn-confirm{background:var(--gradient-accent);color:#fff;box-shadow:0 2px 8px rgba(108,99,255,.2)}
.btn-confirm:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(108,99,255,.3)}
.btn-danger{background:var(--high-bg);color:var(--high)}
.btn-danger:hover{background:#fce4e2}

/* ── 编辑任务弹窗 ── */
.edit-modal{width:min(520px,92vw);max-height:90vh;overflow-y:auto}
.edit-row{display:flex;gap:10px;margin-bottom:12px}
.edit-row > div{flex:1}
.edit-row label{font-size:12px;color:var(--t3);display:block;margin-bottom:4px;font-weight:600}
.edit-row select,.edit-row input{width:100%;border:1.5px solid var(--border);border-radius:var(--r-sm);padding:7px 10px;font-size:13px;font-family:var(--font);outline:none;background:var(--bg);color:var(--text);margin-bottom:0;transition:border-color .2s}
.edit-row select:focus,.edit-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* ── NOTES ── */
.notes-wrap{overflow-y:auto;padding:4px 44px 40px;display:flex;flex-direction:column;gap:12px}
.note-card{background:var(--hover);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;cursor:pointer;transition:all .25s ease;position:relative}
.note-card:hover{box-shadow:var(--shadow-sm);transform:translateY(-2px);border-color:var(--accent-soft)}
.note-card h3{font-size:14px;font-weight:700;margin-bottom:4px}
.note-card p{font-size:13px;color:var(--t2);line-height:1.55;white-space:pre-wrap;word-break:break-word;max-height:60px;overflow:hidden}
.note-card .note-meta{font-size:11.5px;color:var(--t3);margin-top:8px}
.note-del{position:absolute;top:10px;right:10px;opacity:0;background:none;border:none;font-size:16px;color:var(--t3);cursor:pointer;padding:2px 5px;border-radius:4px;transition:all .15s}
.note-card:hover .note-del{opacity:1}
.note-del:hover{color:var(--high);background:var(--high-bg)}
.add-note-btn{align-self:flex-start;padding:8px 20px;background:var(--gradient-accent);color:#fff;border:none;border-radius:var(--r-sm);font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(108,99,255,.2)}
.add-note-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(108,99,255,.3)}
.note-editor{flex:1;display:flex;flex-direction:column;padding:8px 44px 32px;gap:10px;overflow:hidden}
.note-editor input{font-size:20px;font-weight:700;border:none;outline:none;font-family:var(--font);color:var(--text);border-bottom:2px solid var(--border);padding:6px 0 10px;flex-shrink:0;transition:border-color .2s}
.note-editor input:focus{border-bottom-color:var(--accent)}
.note-editor textarea{flex:1;border:none;outline:none;font-family:var(--font);font-size:14px;color:var(--text);resize:none;line-height:1.7;padding:4px 0}
.note-toolbar{display:flex;gap:8px;align-items:center;flex-shrink:0}
.note-toolbar button{padding:6px 14px;border-radius:var(--r-sm);border:none;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.note-back{background:var(--sb-hover);color:var(--t2)}
.note-back:hover{background:var(--sb-active)}
.note-save{background:var(--gradient-accent);color:#fff;box-shadow:0 2px 6px rgba(108,99,255,.2)}
.note-save:hover{transform:translateY(-1px)}
.note-toolbar-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.note-rtb{display:flex;align-items:center;gap:2px;flex-wrap:wrap;padding:6px 8px;background:var(--hover);border-radius:var(--r-sm);border:1px solid var(--border)}
.rtb-btn{border:none;background:none;padding:4px 7px;border-radius:4px;cursor:pointer;font-size:13px;font-family:var(--font);color:var(--text);min-width:28px;transition:all .15s}
.rtb-btn:hover{background:var(--sb-active)}
.rtb-sep{width:1px;height:18px;background:var(--border);margin:0 3px}
.note-body-editor{flex:1;outline:none;font-size:14px;font-family:var(--font);color:var(--text);line-height:1.7;padding:8px 0;overflow-y:auto;min-height:300px;word-break:break-word}
.note-body-editor:empty:before{content:attr(data-placeholder);color:var(--t3);pointer-events:none}
.note-body-editor h1{font-size:20px;font-weight:700;margin:12px 0 4px}
.note-body-editor h2{font-size:16px;font-weight:600;margin:10px 0 4px}
.note-body-editor h3{font-size:14px;font-weight:600;margin:8px 0 4px}
.note-body-editor a{color:var(--accent);text-decoration:underline}
.note-body-editor ul,.note-body-editor ol{padding-left:20px}

/* ── VIEW panels ── */
#task-view{display:flex;flex-direction:row;flex:1;overflow:hidden}
.task-left-col{display:flex;flex-direction:column;flex:1;overflow:hidden;min-width:0}
.task-right-col{display:none!important}
.rich-toolbar{display:flex;align-items:center;gap:2px;padding:8px 14px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;background:var(--sb)}
.rich-btn{background:none;border:none;cursor:pointer;font-size:12px;padding:5px 6px;border-radius:var(--r-sm);color:var(--t2);font-family:var(--font);line-height:1;transition:all .15s;font-weight:500;flex-shrink:0}
.rich-btn:hover{background:var(--sb-active);color:var(--text)}
.rich-btn.active{background:var(--sb-active);color:var(--text)}
.rich-sep{width:1px;height:14px;background:var(--border);margin:0 2px;flex-shrink:0}
.rich-editor{flex:1;overflow-y:auto;padding:20px 24px 40px;outline:none;font-size:14.5px;font-family:var(--font);color:var(--text);line-height:1.85;word-break:break-word;background:var(--bg)}
.rich-editor:empty:before{content:"随手记录…";color:var(--t3);pointer-events:none}
.rich-editor h1{font-size:21px;font-weight:700;margin:14px 0 6px;line-height:1.3}
.rich-editor h2{font-size:17px;font-weight:600;margin:12px 0 4px;line-height:1.3}
.rich-editor h3{font-size:15px;font-weight:600;margin:10px 0 4px;line-height:1.3}
.rich-editor ul,.rich-editor ol{padding-left:22px;margin:4px 0}
.rich-editor li{margin:3px 0}
.rich-editor blockquote{border-left:3px solid var(--accent);margin:8px 0;padding:6px 14px;color:var(--t2);background:var(--accent-soft);border-radius:0 var(--r-sm) var(--r-sm) 0;font-style:italic}
.rich-editor a{color:var(--accent);text-decoration:underline;cursor:pointer}
.rich-editor p{margin:3px 0}
.rich-editor code{background:var(--sb-hover);padding:1px 5px;border-radius:3px;font-size:13px;font-family:monospace;color:#c0392b}
/* checkbox items */
.rich-editor .cb-item{display:flex;align-items:flex-start;gap:8px;padding:3px 0;list-style:none}
.rich-editor .cb-item input[type=checkbox]{margin-top:4px;width:15px;height:15px;flex-shrink:0;cursor:pointer;accent-color:var(--accent)}
.rich-editor .cb-item.cb-done span{text-decoration:line-through;color:var(--t3)}
.rich-editor ul.cb-list{padding-left:0;margin:4px 0}
.rich-status{font-size:11px;color:var(--t3);padding:5px 16px;border-top:1px solid var(--border);flex-shrink:0;text-align:right;background:var(--sb)}
#notes-view{display:none;flex-direction:column;flex:1;overflow:hidden}
#note-editor-view{display:none;flex-direction:column;flex:1;overflow:hidden}

/* ── SCROLLBAR — refined ── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;transition:background .2s}
::-webkit-scrollbar-thumb:hover{background:var(--t3)}

/* ── WEEK VIEW ── */
.week-summary{font-size:13px;color:var(--text);font-weight:600;margin-bottom:16px;line-height:1.6}
.week-timeline{display:flex;overflow:auto;max-height:calc(100vh - 220px);position:relative}
.wt-time-axis{width:44px;flex-shrink:0;padding-top:36px}
.wt-time-slot{height:48px;display:flex;align-items:flex-start;font-size:10px;color:var(--t3);padding-right:6px;text-align:right;box-sizing:border-box;justify-content:flex-end}
.wt-cols-area{flex:1;display:flex;flex-direction:column;min-width:0}
.wt-col-hds{display:grid;grid-template-columns:repeat(7,1fr);position:sticky;top:0;background:var(--bg);z-index:2;border-bottom:1px solid var(--border)}
.wt-col-hd{text-align:center;padding:6px 4px;font-size:11px;font-weight:600;color:var(--t3)}
.wt-col-hd.today{color:var(--accent);font-weight:700}
.wt-cols-body{display:grid;grid-template-columns:repeat(7,1fr);position:relative;flex:1}
.wt-col{position:relative;border-right:1px solid var(--border)}
.wt-col:last-child{border-right:none}
.wt-hour-line{position:absolute;left:0;right:0;height:1px;background:var(--border);pointer-events:none}
.wt-task{position:absolute;left:2px;right:2px;border-radius:var(--r-sm);padding:3px 6px;font-size:11px;cursor:pointer;overflow:hidden;box-sizing:border-box;min-height:18px;transition:all .15s}
.wt-task:hover{opacity:.85;box-shadow:var(--shadow-sm);transform:scale(1.02)}
.wt-task.done{opacity:.4;text-decoration:line-through}
.wt-task-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;line-height:1.3}
.wt-task-time{font-size:9px;opacity:.8;line-height:1.2}
.wt-task.high{background:var(--high-bg);border-left:3px solid var(--high);color:var(--high)}
.wt-task.mid{background:var(--mid-bg);border-left:3px solid var(--mid);color:#92400e}
.wt-task.low{background:var(--low-bg);border-left:3px solid var(--low);color:#166534}
.wt-task.none{background:var(--none-bg);border-left:3px solid var(--none);color:var(--t2)}
.wt-now-line{position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:3;pointer-events:none}
.wt-now-dot{position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px rgba(108,99,255,.4)}

/* 本周列表视图 */
.wk-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.wk-nav-btn{border:1px solid var(--border);background:var(--bg);border-radius:var(--r-sm);padding:5px 14px;font-size:12px;font-family:var(--font);cursor:pointer;color:var(--text);transition:all .2s;font-weight:500}
.wk-nav-btn:hover{background:var(--hover);transform:translateY(-1px);box-shadow:var(--shadow-xs)}
.wk-nav-range{font-size:13px;font-weight:700;color:var(--text)}
.wk-days-wrap{display:flex;flex-direction:column;gap:12px;padding-bottom:40px}
.wk-day-block{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:box-shadow .2s}
.wk-day-block:hover{box-shadow:var(--shadow-xs)}
.wk-day-block.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow-sm)}
.wk-day-hd{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--hover)}
.wk-day-block.today .wk-day-hd{background:var(--accent)}
.wk-day-block.today .wk-day-hd *{color:#fff !important}
.wk-day-name{font-size:13px;font-weight:700;color:var(--text)}
.wk-day-name.past{color:var(--t3)}
.wk-day-name.today{color:var(--text)}
.wk-day-date{font-size:11px;color:var(--t3)}
.wk-day-cnt{font-size:11px;color:var(--t3);margin-left:auto}
.wk-day-empty{padding:8px 14px;font-size:12px;color:var(--t3)}
.wk-task-row{display:flex;align-items:center;gap:8px;padding:7px 14px;border-top:1px solid var(--border);cursor:pointer;transition:all .15s}
.wk-task-row:hover{background:var(--hover)}
.wk-task-row.done .wk-task-title{text-decoration:line-through;color:var(--t3)}
.wk-task-check{width:14px;height:14px;border:1.5px solid var(--t3);border-radius:50%;cursor:pointer;flex-shrink:0;position:relative;transition:all .2s}
.wk-task-check:hover{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.wk-task-check.checked{background:var(--accent);border-color:var(--accent)}
.wk-task-check.checked:after{content:'';position:absolute;left:3px;top:0px;width:5px;height:9px;border:2px solid #fff;border-top:none;border-left:none;transform:rotate(45deg)}
.wk-task-title{flex:1;font-size:13px;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-task-time{font-size:11px;color:var(--t3);flex-shrink:0;white-space:nowrap}

/* ── GOALS ── */
.goals-section{border-top:1px solid var(--border);margin-top:8px;padding:8px 0 4px}
.goals-header{display:flex;align-items:center;justify-content:space-between;padding:2px 14px 6px;cursor:pointer}
.goals-header-label{font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--t3);text-transform:uppercase;display:flex;align-items:center;gap:5px;user-select:none}
.goals-toggle{font-size:10px;color:var(--t3);transition:transform .2s}
.goals-toggle.open{transform:rotate(90deg)}
.goals-body{padding:0 10px;overflow:hidden;max-height:0;transition:max-height .25s ease}
.goals-body.open{max-height:600px}
.goal-item{display:flex;align-items:flex-start;gap:6px;padding:4px 4px;border-radius:var(--r-sm);cursor:default;transition:all .15s;group:true}
.goal-item:hover{background:var(--sb-hover)}
.goal-item:hover .goal-del{opacity:1}
.goal-check{width:14px;height:14px;border:1.5px solid var(--border);border-radius:3px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:2px;transition:all .15s}
.goal-check:hover{border-color:var(--accent)}
.goal-check.checked{background:var(--accent);border-color:var(--accent)}
.goal-check.checked::after{content:'';display:block;width:7px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translate(0px,-1px)}
.goal-text{font-size:12.5px;color:var(--text);flex:1;line-height:1.4;word-break:break-word;cursor:text;outline:none;min-width:0}
.goal-text.done{text-decoration:line-through;color:var(--t3)}
.goal-del{width:16px;height:16px;flex-shrink:0;background:none;border:none;color:var(--t3);cursor:pointer;opacity:0;display:flex;align-items:center;justify-content:center;padding:0;border-radius:3px;transition:all .15s;font-size:12px}
.goal-del:hover{color:var(--high);background:var(--high-bg)}
.goal-add-row{display:flex;align-items:center;gap:6px;padding:4px 4px;margin-top:2px}
.goal-add-input{flex:1;border:none;outline:none;background:transparent;font-family:var(--font);font-size:12.5px;color:var(--text);padding:0}
.goal-add-input::placeholder{color:var(--t3)}
.goal-add-btn{width:18px;height:18px;border-radius:4px;border:1.5px dashed var(--border);background:none;color:var(--t3);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;line-height:1}
.goal-add-btn:hover{border-color:var(--accent);color:var(--accent)}

.task-item.drag-over{border-top:2px solid var(--accent);margin-top:-1px}
.task-item[draggable="true"]{cursor:grab}
.task-item[draggable="true"]:active{cursor:grabbing}

/* ── 目标视图独立页面 ── */
.view-title{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-bottom:4px;background:var(--gradient-accent);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.view-meta{font-size:13px;color:var(--t3);margin-bottom:3px}
.motto{font-size:13px;color:var(--t2);margin-top:5px;margin-bottom:16px;font-style:italic;opacity:.8;line-height:1.5}
/* ── 目标视图 ── */
.goals-view{padding:0 0 40px}
.goals-yr-hd{font-size:13px;font-weight:700;color:var(--text);margin:24px 0 12px;display:flex;align-items:center;gap:8px}
.goals-yr-hd svg{opacity:.5}
.goals-month-block{margin-bottom:20px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:box-shadow .2s}
.goals-month-block:hover{box-shadow:var(--shadow-xs)}
.goals-month-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;user-select:none;transition:background .15s}
.goals-month-hd:hover{background:var(--sb-hover)}
.goals-month-title{font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.goals-month-prog{font-size:11px;color:var(--t3);display:flex;align-items:center;gap:8px}
.goals-prog-bar{width:60px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.goals-prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.goals-month-body{border-top:1px solid var(--border);display:none}
.goals-month-body.open{display:block}
.goal-row{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);transition:all .15s}
.goal-row:last-child{border-bottom:none}
.goal-row:hover{background:var(--sb-hover)}
.goal-row:hover .gr-del{opacity:1}
.gr-check{width:16px;height:16px;border:1.5px solid var(--border);border-radius:4px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .2s}
.gr-check:hover{border-color:var(--accent)}
.gr-check.checked{background:var(--accent);border-color:var(--accent)}
.gr-check.checked::after{content:'';display:block;width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(0,-1px)}
.gr-text{flex:1;font-size:13px;color:var(--text);line-height:1.5;outline:none;cursor:text;word-break:break-word}
.gr-text.done{text-decoration:line-through;color:var(--t3)}
.gr-del{width:18px;height:18px;background:none;border:none;color:var(--t3);cursor:pointer;opacity:0;display:flex;align-items:center;justify-content:center;border-radius:3px;padding:0;transition:all .15s;font-size:13px;flex-shrink:0}
.gr-del:hover{color:var(--high)}
.goal-add-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--border)}
.goal-cat-hd{font-size:12px;font-weight:700;color:var(--text);padding:10px 16px 4px;letter-spacing:.03em;text-transform:uppercase}
.goal-cat-sel{border:1px solid var(--border);border-radius:var(--r-sm);padding:5px 8px;font-size:12px;font-family:var(--font);color:var(--text);background:var(--bg);cursor:pointer;outline:none;flex-shrink:0}
.goal-add-inp{flex:1;border:none;outline:none;background:transparent;font-family:var(--font);font-size:13px;color:var(--text)}
.goal-add-inp::placeholder{color:var(--t3)}
.goal-add-sub{padding:5px 12px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-sm);font-size:12px;font-family:var(--font);cursor:pointer;font-weight:600;transition:all .2s}
.goal-add-sub:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(108,99,255,.2)}
.goals-new-month{display:flex;align-items:center;gap:8px;padding:4px 0;margin-top:4px}
.goals-new-month select{border:1px solid var(--border);border-radius:var(--r-sm);padding:5px 8px;font-family:var(--font);font-size:12.5px;color:var(--text);background:var(--bg);cursor:pointer;outline:none}
.goals-new-month button{padding:5px 12px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-sm);font-family:var(--font);font-size:12.5px;cursor:pointer;font-weight:600}

/* ── SIDEBAR STICKIES — refined toolbar ── */
.sb-stickies{border-top:1px solid var(--border);flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:0}
.sb-stickies-hd{font-size:10.5px;font-weight:600;color:var(--t3);letter-spacing:.04em;text-transform:uppercase;padding:8px 10px 4px;flex-shrink:0}
/* Sticky toolbar — smaller and lighter */
.sb-rich-toolbar{display:flex;align-items:center;gap:0;padding:3px 4px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:nowrap;background:var(--sb);overflow-x:auto}
.sb-rich-toolbar .rich-btn{font-size:11px;padding:3px 4px;color:var(--t3);opacity:.7}
.sb-rich-toolbar .rich-btn:hover{opacity:1;color:var(--text);background:var(--sb-active)}
#sb-sticky-pad{flex:1;border:none;outline:none;background:transparent;font-family:var(--font);font-size:13px;color:var(--text);line-height:1.75;width:100%;box-sizing:border-box;overflow-y:auto;overflow-x:hidden;word-break:break-word;overflow-wrap:break-word;padding:10px 12px 10px 10px}
#sb-sticky-pad:empty:before{content:attr(data-placeholder);color:var(--t3);pointer-events:none}
#sb-sticky-pad ul,#sb-sticky-pad ol{padding-left:20px;margin:4px 0}
#sb-sticky-pad .sp-cb-item{display:flex;align-items:flex-start;gap:6px;padding:2px 0;list-style:none}
#sb-sticky-pad .sp-cb-item input[type=checkbox]{margin-top:3px;width:14px;height:14px;flex-shrink:0;cursor:pointer;accent-color:var(--accent)}
#sb-sticky-pad .sp-cb-item.sp-cb-done span{text-decoration:line-through;color:var(--t3)}
#sb-sticky-pad .sp-cb-item span{flex:1;min-width:0;outline:none}
#sb-sticky-pad a{color:var(--accent);text-decoration:underline;cursor:pointer}
#sb-sticky-pad b,#sb-sticky-pad strong{font-weight:700}
/* 右键菜单 */
.sp-ctx-menu{position:fixed;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:6px 0;z-index:9999;min-width:140px;display:none}
.sp-ctx-menu.show{display:block}
.sp-ctx-item{padding:8px 14px;font-size:13px;font-family:var(--font);color:var(--text);cursor:pointer;white-space:nowrap;transition:background .12s;border-radius:var(--r-sm);margin:0 4px}
.sp-ctx-item:hover{background:var(--hover)}
.sp-ctx-sep{height:1px;background:var(--border);margin:3px 0}

/* 目标双列布局 - Notion 风格 */
.goals-nav{display:flex;align-items:center;gap:16px;margin:0 0 24px}
.goals-nav-btn{background:none;border:1px solid var(--border);border-radius:var(--r-sm);padding:4px 12px;cursor:pointer;font-size:14px;color:var(--t2);transition:all .2s}
.goals-nav-btn:hover{background:var(--hover);transform:translateY(-1px)}
.goals-nav-label{font-size:14px;font-weight:700;color:var(--text);min-width:80px;text-align:center}
.goals-ng-wrap{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding:0 0 60px}
.goals-ng-col{display:flex;flex-direction:column;gap:0;border-radius:var(--r);padding:16px 18px;transition:background .2s}
.goals-ng-col-hd{display:flex;align-items:center;gap:10px;margin-bottom:6px;position:relative}
.goals-col-bg-btn{background:none;border:none;cursor:pointer;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border);margin-left:6px;flex-shrink:0;transition:all .15s}
.goals-col-bg-btn:hover{transform:scale(1.2);border-color:var(--accent)}
.goals-col-bg-picker{position:absolute;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:10px;z-index:200;display:none;flex-wrap:wrap;gap:6px;width:172px;top:24px;left:0}
.goals-col-bg-picker.show{display:flex}
.gcbp-swatch{width:24px;height:24px;border-radius:var(--r-sm);cursor:pointer;border:1.5px solid transparent;transition:all .15s}
.gcbp-swatch:hover{transform:scale(1.15)}
.gcbp-swatch.active{border-color:var(--accent)}
.gcbp-clear{width:100%;font-size:11px;color:var(--t3);background:none;border:none;cursor:pointer;text-align:left;padding:2px 0;margin-top:2px}
.goals-ng-col-title{font-size:15px;font-weight:700;color:var(--text)}
.goals-ng-col-stat{font-size:12px;color:var(--t3)}
.goals-ng-prog-bar{height:3px;background:var(--border);border-radius:2px;margin-bottom:20px;overflow:hidden}
.goals-ng-prog-fill{height:100%;background:var(--gradient-accent);border-radius:2px;transition:width .3s}
.goals-ng-cat{margin-bottom:20px}
.goals-ng-cat-hd{display:flex;align-items:center;gap:6px;padding:0 0 6px;border-bottom:1px solid var(--border);margin-bottom:2px}
.goals-ng-cat-name{font-size:13px;font-weight:700;color:var(--text);flex:1;outline:none;cursor:text}
.goals-ng-cat-stat{font-size:11px;color:var(--t3);flex-shrink:0}
.goals-ng-cat-del,.goals-ng-cat-mv{background:none;border:none;cursor:pointer;color:var(--t3);padding:2px;display:none;line-height:1}
.goals-ng-cat-hd:hover .goals-ng-cat-del,.goals-ng-cat-hd:hover .goals-ng-cat-mv{display:inline-flex}
.goals-ng-cat-mv:hover{color:var(--text)}
.goals-ng-col-desc{width:100%;box-sizing:border-box;border:none;border-bottom:1px dashed var(--border);outline:none;resize:none;font-family:var(--font);font-size:12.5px;color:var(--t2);background:transparent;line-height:1.6;padding:6px 0 8px;min-height:22px;overflow:hidden;margin-bottom:14px;transition:border-color .2s}
.goals-ng-col-desc::placeholder{color:var(--t3)}
.goals-ng-col-desc:focus{border-bottom-color:var(--accent)}
.goals-ng-item{display:flex;align-items:center;gap:8px;padding:5px 0 5px 4px;border-radius:var(--r-sm);transition:all .15s}
.goals-ng-item:hover{background:var(--hover)}
.goals-ng-item.done .goals-ng-text{text-decoration:line-through;color:var(--t3)}
.goals-ng-check{width:14px;height:14px;border:1.5px solid var(--t3);border-radius:3px;cursor:pointer;flex-shrink:0;position:relative;transition:all .2s}
.goals-ng-check:hover{border-color:var(--accent)}
.goals-ng-check.checked{background:var(--accent);border-color:var(--accent)}
.goals-ng-check.checked:after{content:'';position:absolute;left:3px;top:0px;width:5px;height:9px;border:2px solid #fff;border-top:none;border-left:none;transform:rotate(45deg)}
.goals-ng-text{flex:1;font-size:13px;color:var(--text);outline:none;min-width:0;word-break:break-word;line-height:1.5}
.goals-ng-del{background:none;border:none;cursor:pointer;color:var(--t3);padding:2px;display:none;line-height:1}
.goals-ng-item:hover .goals-ng-del{display:inline-flex}
.goals-ng-item.warned{background:var(--mid-bg)}
.goals-ng-item.warned .goals-ng-text{color:#92400e}
.goals-ng-warn{background:none;border:none;cursor:pointer;color:var(--t3);padding:2px;display:none;line-height:1;flex-shrink:0}
.goals-ng-warn.active{display:inline-flex !important}
.goals-ng-item:hover .goals-ng-warn{display:inline-flex}
.goals-ng-add-row{padding:0 0 0 22px;max-height:0;overflow:hidden;transition:max-height .15s}
.goals-ng-add-row.open{max-height:36px;padding:4px 0 4px 22px}
.goals-ng-cat-add-btn{background:none;border:none;cursor:pointer;color:var(--t3);font-size:16px;line-height:1;padding:0 4px;transition:color .15s;font-weight:300}
.goals-ng-cat-add-btn:hover{color:var(--accent)}
.goals-ng-add-inp{width:100%;border:none;outline:none;font-size:12.5px;font-family:var(--font);color:var(--t2);background:transparent}
.goals-ng-add-inp::placeholder{color:var(--t3)}
.goals-ng-new-cat{padding:6px 0 0}
.goals-ng-new-cat-inp{width:100%;border:none;outline:none;font-size:12.5px;font-family:var(--font);color:var(--t2);background:transparent;padding:4px 0}
.goals-ng-new-cat-inp::placeholder{color:var(--t3)}
</style>
</head>
<body>

<!-- SIDEBAR -->
<nav class="sidebar">
  <div class="ws" style="cursor:default">
    <div class="ws-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
    <span id="app-name" ondblclick="editAppName()" title="双击编辑名称" style="cursor:text;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">我的清单</span>
    <input id="app-name-input" onblur="saveAppName()" onkeydown="if(event.key==='Enter')saveAppName();if(event.key==='Escape')cancelAppName()" style="display:none;flex:1;border:none;outline:none;background:transparent;font-family:var(--font);font-size:14px;font-weight:700;color:var(--text);min-width:0"/>
  </div>
  <div class="sb-sec">智能清单</div>
  <div id="sb-smart-list"></div>
  <div class="sb-sec" style="margin-top:8px;display:none;align-items:center;justify-content:space-between;padding-right:14px">
    <span id="my-lists-label" ondblclick="editListsLabel()" title="双击编辑" style="cursor:text">我的清单</span>
    <input id="my-lists-input" onblur="saveListsLabel()" onkeydown="if(event.key==='Enter')saveListsLabel();if(event.key==='Escape')cancelListsLabel()" style="display:none;border:none;outline:none;background:transparent;font-family:var(--font);font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--t3);text-transform:uppercase;width:80px"/>
    <button onclick="showListModal(null)" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:16px;line-height:1;padding:0 2px;transition:color .1s" title="新建清单" onmouseenter="this.style.color='var(--text)'" onmouseleave="this.style.color='var(--t3)'">+</button>
  </div>
  <div class="sb-lists" id="sb-lists" style="display:none"></div>

  <!-- ── 便签区（升级版，带工具栏） ── -->
  <div class="sb-stickies" id="sb-stickies-area">
    <div class="sb-stickies-hd">便签</div>
    <div class="sb-rich-toolbar">
      <button class="rich-btn" title="加粗" onclick="spCmd('bold')"><b>B</b></button>
      <button class="rich-btn" title="斜体" onclick="spCmd('italic')"><i>I</i></button>
      <button class="rich-btn" title="下划线" onclick="spCmd('underline')"><u>U</u></button>
      <div class="rich-sep"></div>
      <button class="rich-btn" title="标题1" onclick="spBlock('h1')">H1</button>
      <button class="rich-btn" title="标题2" onclick="spBlock('h2')">H2</button>
      <div class="rich-sep"></div>

// 启动修正：结束早于开始的旧任务自动对调起止时间
(function fixOldTimeRanges(){
  let fixed = false;
  tasks.forEach(t => {
    if (t.dt && t.dtEnd) {
      const r = fixTimeRange(t.dt, t.dtEnd);
      if (r.dt !== t.dt || r.dtEnd !== t.dtEnd) { t.dt = r.dt; t.dtEnd = r.dtEnd; fixed = true; }
    }
  });
  if (fixed) localStorage.setItem('td_tasks', JSON.stringify(tasks));
})();
// 启动去重：
// 1. 完全相同(title+dt+repeat)的未完成任务只保留一个
// 2. 同title+同repeat(非空)的未完成任务，只保留dt最大的那个（递归任务只需要一个未来实例）
(function dedupTasks(){
  const before = tasks.length;
  // Phase 1: exact dedup
  const seen = new Set();
  tasks = tasks.filter(t => {
    if (t.done) return true;
    const key = `${t.title}|${t.dt}|${t.repeat||''}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  // Phase 2: recurring dedup — same title+repeat, keep only latest dt
  const recurMap = new Map(); // key: title|repeat → {maxDt, idx}
  tasks.forEach((t, i) => {
    if (t.done || !t.repeat) return;
    const key = `${t.title}|${t.repeat}`;
    const existing = recurMap.get(key);
    if (!existing || (t.dt||'') > (existing.maxDt||'')) {
      if (existing) existing.remove = true;
      recurMap.set(key, {maxDt: t.dt||'', idx: i, remove: false});
    } else {
      tasks[i]._remove = true;
    }
  });
  recurMap.forEach(v => { if (v.remove) tasks[v.idx]._remove = true; });
  tasks = tasks.filter(t => !t._remove);
  tasks.forEach(t => delete t._remove);
  if (tasks.length < before) {
    localStorage.setItem('td_tasks', JSON.stringify(tasks));
    console.log('[Todo dedup] Removed', before - tasks.length, 'duplicate(s)');
  }
})();

function changeGoalsMonth(delta) {
  const [yr, mo] = goalsViewYM.split('-').map(Number);
  const fromYM = goalsViewYM; // 切换前的月份（来源月）
  const d = new Date(yr, mo - 1 + delta, 1);
  goalsViewYM = d.getFullYear() + '-' + ('' + (d.getMonth() + 1)).padStart(2, '0');
  // 新月份没有数据 → 从来源月复制分类结构
  const _existCheck = goalsNG[goalsViewYM];
const _hasGoalItems = _existCheck && ['team','personal'].some(col => {
  const c = _existCheck[col] || {};
  return Object.entries(c).some(([k,v]) => !k.startsWith('__') && Array.isArray(v) && v.length > 0);
});
if (!goalsNG[goalsViewYM] || !_hasGoalItems) { 
    const srcData = goalsNG[fromYM];
    if (srcData) {
      goalsNG[goalsViewYM] = { team: {}, personal: {} };
      ['team', 'personal'].forEach(col => {
        const srcCol = srcData[col] || {};
        const srcOrder = srcCol.__order__ || Object.keys(srcCol).filter(k => !k.startsWith('__'));
        srcOrder.forEach(cat => {
          const srcItems = srcCol[cat] || [];
          goalsNG[goalsViewYM][col][cat] = srcItems.map(item => ({
            id: Date.now().toString() + Math.random().toString(36).slice(2, 6),
            text: item.text,
            done: false
          }));
        });
        goalsNG[goalsViewYM][col].__order__ = [...srcOrder];
        // 复制分类总目标描述
        if (srcCol.__desc__) {
          goalsNG[goalsViewYM][col].__desc__ = Object.assign({}, srcCol.__desc__);
        }
        // 复制列总描述
        if (srcCol.__col_desc__) {
          goalsNG[goalsViewYM][col].__col_desc__ = srcCol.__col_desc__;
        }
      });
      saveGoalsNG();
    }
  }
  renderGoalsView();
}

function moveGoalCat(col, cat, dir) {

  const j = i + dir;
  if (j < 0 || j >= order.length) return;
  [order[i], order[j]] = [order[j], order[i]];
  saveGoalsNG();
  renderGoalsView();
}

  if (!data[col].__order__) {

  }
  return data[col].__order__;
}

// ── 粘贴 URL 自动抓取标题 ──
async function fetchUrlTitle(url) {
  try {
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
    const res = await fetch(proxyUrl, {signal: AbortSignal.timeout(5000)});
    const data = await res.json();
    const html = data.contents || '';
    const m = html.match(/<title[^>]*>([^<]{1,200})<\/title>/i);
    return m ? m[1].trim().replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'") : null;
  } catch(e) { return null; }
}

async function onPasteAutoLink(e, targetId) {
  const text = e.clipboardData.getData('text/plain').trim();
  if (!text.startsWith('http')) return;
  const el = document.getElementById(targetId);
  if (!el) return;
  // 给个视觉提示
  const prevPlaceholder = el.placeholder;
  if (el.placeholder !== undefined) el.placeholder = '正在获取链接标题…';
  const title = await fetchUrlTitle(text);
  if (el.placeholder !== undefined) el.placeholder = prevPlaceholder;
  if (title && title !== text) {
    // 插入格式：[标题](url) 样式的纯文本，方便 linkify 渲染
    e.preventDefault();
    const insert = `${title} ${text}`;
    if (el.tagName === 'TEXTAREA') {
      const pos = el.selectionStart;
      el.value = el.value.slice(0, pos) + insert + el.value.slice(el.selectionEnd);
      el.selectionStart = el.selectionEnd = pos + insert.length;
    } else {
      el.value = (el.value ? el.value + ' ' : '') + insert;
    }
  }
  // 如果没有抓到标题，让默认粘贴行为正常发生
}

// ── 拖拽链接到输入框 ──
function onDropLink(e, targetId) {
  e.preventDefault();
  const url = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain') || '';
  if (!url || !url.startsWith('http')) return;
  const el = document.getElementById(targetId);
  if (!el) return;
  if (el.tagName === 'TEXTAREA') {
    const pos = el.selectionStart || el.value.length;
    el.value = el.value.slice(0, pos) + url + el.value.slice(pos);
  } else {
    el.value = (el.value ? el.value + ' ' : '') + url;
  }
  el.focus();
}

function editMotto() {
  const el = document.getElementById('motto');

  el.textContent = cur;     // 先把innerHTML换成纯文字，方便编辑
  el.setAttribute('contenteditable', 'true');
  el.focus();
  // 全选
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  function done() {
    el.removeAttribute('contenteditable');
    el.removeEventListener('blur', done);
    el.removeEventListener('keydown', onKey);
    const val = el.innerText.trim();
    if (val) {
      localStorage.setItem('td_motto_custom', val);
      setMottoHTML(el, val);
    }
  }
  function onKey(e) {
    if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    if (e.key === 'Escape') {
      setMottoHTML(el, cur);
      el.removeAttribute('contenteditable');
      el.removeEventListener('blur', done);
      el.removeEventListener('keydown', onKey);
    }
  }
  el.addEventListener('blur', done);
  el.addEventListener('keydown', onKey);
}

// ── 便签 ──
function stickyAutoLinkify(el) {
  if (!el) return;
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
  const urlRe = /(https?:\/\/[^\s<>"']+)/g;
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  let changed = false;
  nodes.forEach(tn => {
    if (tn.parentElement && tn.parentElement.tagName === 'A') return;
    if (!urlRe.test(tn.textContent)) return;
    urlRe.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = urlRe.exec(tn.textContent)) !== null) {
      if (m.index > last) frag.appendChild(document.createTextNode(tn.textContent.slice(last, m.index)));
      const a = document.createElement('a');
      a.href = m[1]; a.textContent = m[1];
      a.target = '_blank'; a.rel = 'noopener';
      frag.appendChild(a);
      last = m.index + m[0].length;
    }
    if (last < tn.textContent.length) frag.appendChild(document.createTextNode(tn.textContent.slice(last)));
    tn.parentNode.replaceChild(frag, tn);
    changed = true;
  });
  return changed;
}
function saveStickyPad() {
  const el = document.getElementById('sb-sticky-pad');

    stickyAutoLinkify(el);
    localStorage.setItem('td_sticky_pad', el.innerHTML);

// 修复历史内容：空勾选框 + 后面的文本块 → 把文字并入勾选框 span，使二者同排
// 强壮版：自动补 span、跳过中间空行、合并到下一个勾选框之前的所有文本
function normalizeStickyCheckboxes(pad) {
  if (!pad) return;
  let changed = false;
  function blockText(el){ return el ? el.textContent.replace(/\u00a0/g,'').replace(/[\s\n]/g,'').trim() : ''; }
  for (let pass = 0; pass < 100; pass++) {
    let mergedThisPass = false;
    const items = Array.from(pad.querySelectorAll('.sp-cb-item'));
    for (const item of items) {
      // 1) 确保有 span（旧结构可能丢了 span）
      let span = item.querySelector('span');
      if (!span) {
        span = document.createElement('span');
        span.setAttribute('contenteditable','true');
        span.innerHTML = '\u00a0';
        item.appendChild(span);
        changed = true;
      }
      // 2) span 已有真实文字 → 跳过
      if (blockText(span)) continue;
      // 3) span 为空：向后找第一个"有文字的普通块"（跳过纯空行），遇到下一个勾选框就停
      let cursor = item.nextElementSibling;
      let textBlock = null;
      const emptiesToRemove = [];
      while (cursor) {
        if (cursor.classList && cursor.classList.contains('sp-cb-item')) break; // 到下一个勾选框，停
        if (blockText(cursor)) { textBlock = cursor; break; }
        emptiesToRemove.push(cursor); // 中间的空行，记下来一起删
        cursor = cursor.nextElementSibling;
      }
      if (!textBlock) continue; // 后面没有可合并的文字
      // 4) 把文字块内容搬进 span（保留加粗/链接等富文本）
      span.innerHTML = textBlock.innerHTML;
      textBlock.remove();
      emptiesToRemove.forEach(e => e.remove()); // 顺手清掉中间夹的空行
      mergedThisPass = true;
      changed = true;
    }
    if (!mergedThisPass) break;
  }
  if (changed) saveStickyPad();
}
// 手动整理便签（工具栏按钮调用）
function spTidyCheckboxes() {
  const pad = document.getElementById('sb-sticky-pad');
  if (!pad) return;
  normalizeStickyCheckboxes(pad);
  pad.focus();
}
function spCmd(cmd) {
  document.getElementById('sb-sticky-pad').focus();

}
function spBlock(tag) {

function spInsertCheckbox() {
  const pad = document.getElementById('sb-sticky-pad');
  pad.focus();
  // 检查光标是否已在 checkbox 行内，如果是则移除 checkbox（toggle 行为）
  const sel = window.getSelection();
  if (sel.rangeCount) {
    const node = sel.anchorNode;
    const existing = node && (node.closest ? node.closest('.sp-cb-item') : node.parentElement && node.parentElement.closest('.sp-cb-item'));
    if (existing) {
      // 移除 checkbox，保留文字内容
      const span = existing.querySelector('span');
      const text = span ? span.innerHTML : '';
      const p = document.createElement('div');
      p.innerHTML = text || '<br>';
      existing.replaceWith(p);
      // 光标放到新元素
      const r = document.createRange(); r.selectNodeContents(p); r.collapse(false);
      sel.removeAllRanges(); sel.addRange(r);
      saveStickyPad();
      return;
    }
  }
  // 不在 checkbox 内，插入新的
  const id = 'spcb_' + Date.now();
  const html = `<div class="sp-cb-item" data-cbid="${id}"><input type="checkbox" onchange="spCbToggle(this)"><span contenteditable="true">&nbsp;</span></div>`;
  document.execCommand('insertHTML', false, html);

document.addEventListener('DOMContentLoaded', function() {
  const sidebar = document.querySelector('.sidebar');
  const resizer = document.getElementById('sb-resizer');
  if (!sidebar || !resizer) return;
  const MIN_W = 200, MAX_W = 500;
  // 恢复上次保存的宽度
  const saved = parseInt(localStorage.getItem('td_sidebar_w'), 10);
  if (saved && saved >= MIN_W && saved <= MAX_W) sidebar.style.width = saved + 'px';
  let dragging = false;
  resizer.addEventListener('mousedown', function(e) {
    e.preventDefault();
    dragging = true;
    resizer.classList.add('sb-resizing');
    document.body.classList.add('sb-resizing-active');
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    let w = e.clientX - sidebar.getBoundingClientRect().left;
    if (w < MIN_W) w = MIN_W;
    if (w > MAX_W) w = MAX_W;
    sidebar.style.width = w + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false;
    resizer.classList.remove('sb-resizing');
    document.body.classList.remove('sb-resizing-active');
    localStorage.setItem('td_sidebar_w', parseInt(sidebar.style.width, 10));

// 便签区键盘事件
document.addEventListener('DOMContentLoaded', function() {
  const pad = document.getElementById('sb-sticky-pad');
  if (!pad) return;
  pad.addEventListener('keydown', function(e) {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    const node = sel.anchorNode;
    const cbItem = node && (node.closest ? node.closest('.sp-cb-item') : node.parentElement && node.parentElement.closest('.sp-cb-item'));

    if (e.key === 'Enter' && cbItem) {
      e.preventDefault();
      const span = cbItem.querySelector('span');
      const text = span ? span.textContent.replace(/\u00a0/g,'').trim() : '';
      if (!text) {
        // 空 checkbox 按 Enter：退出 checkbox 模式，变普通行
        const p = document.createElement('div');
        p.innerHTML = '<br>';
        cbItem.replaceWith(p);
        const r = document.createRange(); r.selectNodeContents(p); r.collapse(false);
        sel.removeAllRanges(); sel.addRange(r);
      } else {
        // 有内容：新建下一个 checkbox 行
        const id = 'spcb_' + Date.now();
        const newItem = document.createElement('div');
        newItem.className = 'sp-cb-item';
        newItem.setAttribute('data-cbid', id);
        newItem.innerHTML = `<input type="checkbox" onchange="spCbToggle(this)"><span contenteditable="true">\u00a0</span>`;
        cbItem.after(newItem);
        // 光标移到新行 span
        const newSpan = newItem.querySelector('span');
        const r = document.createRange(); r.selectNodeContents(newSpan); r.collapse(false);
        sel.removeAllRanges(); sel.addRange(r);
      }
      saveStickyPad();
      return;
    }

    if (e.key === 'Backspace' && cbItem) {
      const span = cbItem.querySelector('span');
      const text = span ? span.textContent.replace(/\u00a0/g,'').trim() : '';
      if (!text && sel.anchorOffset === 0) {
        // 空 checkbox：转为普通 div
        e.preventDefault();
        const p = document.createElement('div');
        p.innerHTML = '<br>';
        cbItem.replaceWith(p);
        const r = document.createRange(); r.selectNodeContents(p); r.collapse(false);
        sel.removeAllRanges(); sel.addRange(r);
        saveStickyPad();
      }
    }
  });
});

function autoFillEditEndTime() {
  const sd = document.getElementById('edit-dt-date').value;
  const sh = document.querySelector('#edit-hour-col .selected')?.textContent || '';
  const sm = document.querySelector('#edit-min-col .selected')?.textContent || '';
  if (!sd || !sh || !sm) return;
  const d = new Date(`${sd}T${sh}:${sm}`);
  d.setMinutes(d.getMinutes()+30);
  const edate = p2(d.getFullYear())+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
  const eh = p2(d.getHours()), em = p2(d.getMinutes());
  // 找最近的5分档
  const emRound = EDIT_MINS.reduce((a,b)=>Math.abs(parseInt(b)-d.getMinutes())<Math.abs(parseInt(a)-d.getMinutes())?b:a);
  document.getElementById('edit-dt-end-date').value = edate;
  document.querySelectorAll('#edit-ehour-col .time-slot').forEach(e=>{
    e.classList.toggle('selected', e.textContent===eh);
  });
  document.querySelectorAll('#edit-emin-col .time-slot').forEach(e=>{
    e.classList.toggle('selected', e.textContent===emRound);
  });
  syncEditDTHidden();
}

  const sd = document.getElementById('edit-dt-date').value;
  const sh = document.querySelector('#edit-hour-col .selected')?.textContent || '';
  const sm = document.querySelector('#edit-min-col .selected')?.textContent || '';

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
}
function nowHM() {
  const d = new Date();
  // 取整到5分钟
  const m = Math.round(d.getMinutes()/5)*5;
  return { h: p2(d.getHours()), m: p2(m >= 60 ? 0 : m) };
}
function isToday(dt) { return dt && dt.startsWith(todayStr()); }
function isOverdue(dt) {
  if (!dt) return false;
  return new Date(dt) < new Date();
}
function fmtDT(dt) {
  if (!dt) return '';
  const d = new Date(dt);
  const today = todayStr(), dtDate = dt.slice(0,10);
  const hasTime = dt.includes('T') && dt.length > 10;
  const timePart = hasTime ? ` ${p2(d.getHours())}:${p2(d.getMinutes())}` : '';
  const diff = Math.round((new Date(dtDate) - new Date(today)) / 86400000);
  let datePart;
  if (diff === 0) datePart = '今天';
  else if (diff === 1) datePart = '明天';
  else if (diff === -1) datePart = '昨天';
  else if (d.getFullYear() === new Date().getFullYear()) datePart = `${d.getMonth()+1}月${d.getDate()}日`;
  else datePart = dt.slice(0,10);
  return datePart + timePart;
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function linkify(text) {
  if(!text) return '';
  // 先 escHtml，再替换 URL 为链接
  const escaped = escHtml(text);
  return escaped.replace(/(https?:\/\/[^\s<>"]+)/g, (url) => {
    // 判断是否学城链接
    const isKM = url.includes('km.sankuai.com') || url.includes('sankuai.com');
    const label = isKM ? '📄 ' + url.replace(/^https?:\/\//,'').split('/')[0] + '…' : url.length > 40 ? url.slice(0,40)+'…' : url;
    return `<a href="${url}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;font-size:inherit" onmouseenter="this.style.textDecoration='underline'" onmouseleave="this.style.textDecoration='none'" onclick="event.stopPropagation()">${label}</a>`;
  });
}
function buildDTValue(date, h, m) {
  if (!date) return '';
  if (!h) return date;
  return `${date}T${h}:${m||'00'}`;
}
// 修正起止时间：若结束早于开始（二者都含具体时间），自动对调。返回 {dt, dtEnd}
function fixTimeRange(dt, dtEnd) {
  if (!dt || !dtEnd) return { dt, dtEnd };
  // 只有两者都含时间（带 T）才比较
  if (!dt.includes('T') || !dtEnd.includes('T')) return { dt, dtEnd };
  const s = new Date(dt), e = new Date(dtEnd);
  if (isNaN(s) || isNaN(e)) return { dt, dtEnd };
  if (e.getTime() < s.getTime()) {
    // 结束早于开始 → 互换，保证区间合法
    return { dt: dtEnd, dtEnd: dt };
  }
  return { dt, dtEnd };
}

function toggleTask(id) {
  const t = tasks.find(t => t.id == id);
  if (!t) return;
  t.done = !t.done;
  // 记录完成日期（取消完成时清除）
  t.doneAt = t.done ? todayStr() : null;
  // 如果是循环任务，完成后生成下一次（去重：同名+同日期+未完成 不重复生成）
  if (t.done && t.repeat && t.repeat !== 'none' && t.dt) {
    const nextDt = calcNextRepeat(t.dt, t.repeat);
    if (nextDt) {
      // 只要存在同名+同repeat+未完成的未来任务，就不再生成新的
      const hasDup = tasks.some(x => !x.done && x.title === t.title && x.repeat === t.repeat && x.id !== t.id);
      if (!hasDup) {
        tasks.push({
          id: Date.now(), title: t.title, done: false,
          priority: t.priority, dt: nextDt, listId: t.listId,
          repeat: t.repeat, createdAt: todayStr(),
          tags: t.tags ? [...t.tags] : undefined,
          body: t.body || ''
        });
      }
    }
  }
  save(); render();
}

function calcNextRepeat(dt, repeat) {
  const d = new Date(dt);
  if (isNaN(d.getTime())) return null;
  if (repeat.startsWith('custom:')) {
    const parts = repeat.split(':');
    const unit = parts[1], num = parseInt(parts[2]);
    if(unit==='day') { d.setDate(d.getDate()+num); }
    else if(unit==='week') {
      const wdsPart = (parts[3] && parts[3]!=='end') ? parts[3] : null;
      const wds = wdsPart ? wdsPart.split(',').map(Number).sort((a,b)=>a-b) : [1];
      // 找到当前日期在 wds 中的位置，确定下一个目标
      const curWd = d.getDay(); // 0=日
      // 先找当前周内（wds 中大于 curWd 的最小值）
      const nextInWeek = wds.find(w => w > curWd);
      if (nextInWeek !== undefined) {
        // 当前周内有下一个匹配星期 → 只跳到那天
        d.setDate(d.getDate() + (nextInWeek - curWd));
      } else {
        // 当前周内没有 → 跳 N 周后，从周一开始找 wds 中最小的星期
        // 先跳到下 N 周的周一
        const daysToNextMonday = (8 - curWd) % 7 || 7; // 到下周一的天数
        d.setDate(d.getDate() + daysToNextMonday + (num - 1) * 7);
        // 再在那一周内找 wds 的第一个匹配
        const weekDay0 = d.getDay(); // 跳到了下N周的周一（=1）
        const targetWd = wds[0]; // 最小星期
        // 计算到 targetWd 的偏移（周一=1, targetWd 相对周一的偏移）
        let offset = targetWd - d.getDay();
        if (offset < 0) offset += 7;
        d.setDate(d.getDate() + offset);
      }
    }
    else if(unit==='month') { d.setMonth(d.getMonth()+num); }
    const hasTime = dt.includes('T');
    if(hasTime) return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`;
    return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
  }
  switch (repeat) {
    case 'daily':   d.setDate(d.getDate() + 1); break;
    case 'weekday': {
      d.setDate(d.getDate() + 1);
      while (!isCnWorkday(d)) d.setDate(d.getDate() + 1);
      break;
    }
    case 'weekly':  d.setDate(d.getDate() + 7); break;
    case 'monthly': d.setMonth(d.getMonth() + 1); break;
    case 'yearly':  d.setFullYear(d.getFullYear() + 1); break;
    default: return null;
  }
  const hasTime = dt.includes('T');
  if (hasTime) {
    return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`;
  }
  return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
}
