function autoFixWeekdayHolidays() {
  // 自动将 weekday 重复任务中落在节假日的 dt 推进到下一个工作日
  let changed = false;
  console.log('[holiday-fix] 开始检查, tasks:', tasks.length);
  for (const t of tasks) {
    if (t.repeat !== 'weekday' || !t.dt || t.done) continue;
    const dateOnly = t.dt.slice(0, 10);
    const parts = dateOnly.split('-');
    const d = new Date(+parts[0], +parts[1]-1, +parts[2]);
    if (!isCnWorkday(d)) {
      // 推进到下一个工作日
      while (!isCnWorkday(d)) d.setDate(d.getDate() + 1);
      const newDate = `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
      t.dt = t.dt.includes('T') ? newDate + t.dt.slice(10) : newDate;
      changed = true;
    }
  }
  if (changed) { save(); console.log('[holiday-fix] 已修正并保存'); }
  else { console.log('[holiday-fix] 无需修正'); }
}

function getVisible() {
  autoFixWeekdayHolidays();
  let r = [...tasks];
  if (curView === 'today')       r = r.filter(t => isToday(t.dt) || isOverdue(t.dt) || !t.dt);
  else if (curView === 'done')   r = r.filter(t => t.done);
  else if (curView === 'all')    {}
  else if (curView.startsWith('list:')) r = r.filter(t => t.listId === curView.slice(5));

  if (curFilter === 'active')  r = r.filter(t => !t.done);
  else if (curFilter === 'high')    r = r.filter(t => (t.priority === 'high' || t.priority === 'mid') && !t.done);
  else if (curFilter === 'overdue') r = r.filter(t => isOverdue(t.dt) && !t.done);
  else if (curFilter === 'done') {
    // 在「今天」视图下，只显示今天完成的任务
    // doneAt 有值则精确匹配；无 doneAt（历史数据）则用任务日期 dt 判断
    if (curView === 'today') r = r.filter(t => t.done && (t.doneAt ? t.doneAt === todayStr() : isToday(t.dt)));
    else r = r.filter(t => t.done);
  }
  else if (curFilter === 'all' && curView === 'today') {
    // 「今天」视图下「全部」= 今天待完成 + 今天已完成（排除非今天完成的历史任务）
    r = r.filter(t => !t.done || (t.done && (t.doneAt ? t.doneAt === todayStr() : isToday(t.dt))));
  }

  r.sort((a,b) => {
    // 有时间的排前面，按时间升序
    if (a.dt && b.dt) return new Date(a.dt) - new Date(b.dt);
    if (a.dt) return -1; if (b.dt) return 1;
    // 都没时间，按优先级
    const pO = { high:0, mid:1, low:2, none:3 };
    const pa = pO[a.priority]??3, pb = pO[b.priority]??3;
    return pa - pb;
  });
  // Tag filter
  if (tagFilter) {
    r = r.filter(t => {
      const tags = t.tags || parseTags(t.title);
      return tags.includes(tagFilter);
    });
  }
  return r;
}

function getRepeatLabel(repeat) {
  if(!repeat || repeat==='none') return '';
  if(repeat.startsWith('custom:')) {
    const parts = repeat.split(':');
    const unit=parts[1], num=parseInt(parts[2]);
    const unitMap={day:'天',week:'周',month:'月'};
    if(unit==='week') {
      // parts[3] might be wds or 'end', skip if it's 'end'
      const wdsPart = (parts[3] && parts[3]!=='end') ? parts[3] : null;
      if(wdsPart) {
        const wdNames=['日','一','二','三','四','五','六'];
        const wdStr=wdsPart.split(',').map(w=>'周'+wdNames[parseInt(w)]).join('、');
        return num===1?`每周${wdStr}`:`每${num}周${wdStr}`;
      }
      return num===1?`每周`:`每${num}周`;
    }
    return num===1?`每${unitMap[unit]||unit}`:`每${num}${unitMap[unit]||unit}`;
  }
  return REPEAT_LABELS[repeat]||repeat;
}

function onSmartDragStart(e, id) {

function onSmartDragOver(e) {

function onSmartDrop(e, targetId) {

function onSmartDragEnd(e) {

function renderWeekView() {
  const main = document.getElementById('task-list');
  const now = new Date();
  const base = new Date(now);
  base.setDate(now.getDate() + weekOffset * 7);
  const dayOfWeek = base.getDay();
  const monday = new Date(base);
  monday.setDate(base.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
  monday.setHours(0,0,0,0);
  const days = Array.from({length:7}, (_,i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return d;
  });
  const todayStr2 = todayStr();
  const dayNames = ['周一','周二','周三','周四','周五','周六','周日'];
  const sunday = days[6];
  const rangeText = `${monday.getMonth()+1}月${monday.getDate()}日 - ${sunday.getMonth()+1}月${sunday.getDate()}日`;

  // 统计
  let weekTotal = 0, weekDone = 0, weekPending = 0, weekOverdue = 0;
  const nowTs = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  days.forEach(d => {
    const ds = `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
    tasks.filter(t => t.dt && t.dt.startsWith(ds)).forEach(t => {
      weekTotal++;
      if (t.done) weekDone++;
      else { weekPending++; if (d < nowTs) weekOverdue++; }
    });
  });

  // 更新侧边栏计数
  const wkEl = document.getElementById('cnt-week');
  if (wkEl) wkEl.textContent = weekPending || '';

  // 标题
  const titleEl = document.querySelector('.view-title');
  if (titleEl) titleEl.textContent = weekOffset === 0 ? '本周一览' : weekOffset < 0 ? '历史周览' : '未来周览';

  // 翻周导航
  const backBtn = weekOffset !== 0
    ? `<button onclick="changeWeek(0)" class="wk-nav-btn">回本周</button>` : '';
  const navHtml = `<div class="wk-nav">
    <button onclick="changeWeek(-1)" class="wk-nav-btn">← 上周</button>
    <span class="wk-nav-range">${rangeText}</span>
    <button onclick="changeWeek(1)" class="wk-nav-btn">下周 →</button>
    ${backBtn}
  </div>`;

  const summaryHtml = `<div class="week-summary">共 ${weekTotal} 件 · 已完成 <b>${weekDone}</b> · 待完成 <b>${weekPending}</b>${weekOverdue ? ` · <span style="color:#e53e3e">逾期 ${weekOverdue}</span>` : ''}</div>`;

  // 按天渲染列表
  let daysHtml = '';
  days.forEach((d, i) => {
    const ds = `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
    const isToday = ds === todayStr2;
    const isPast = d < nowTs;

    // 该天任务，按时间排序（有时间的升序，无时间的放最后）
    const dayTasks = tasks
      .filter(t => t.dt && t.dt.startsWith(ds))
      .sort((a, b) => {
        const aT = a.dt && a.dt.includes('T') ? a.dt : '9999';
        const bT = b.dt && b.dt.includes('T') ? b.dt : '9999';
        return aT < bT ? -1 : aT > bT ? 1 : 0;
      });

    if (dayTasks.length === 0 && !isToday) return; // 空天跳过（今天始终显示）

    const doneCnt = dayTasks.filter(t=>t.done).length;
    const dateLabel = `${p2(d.getMonth()+1)}/${p2(d.getDate())}`;

    daysHtml += `<div class="wk-day-block ${isToday?'today':''}">`;
    daysHtml += `<div class="wk-day-hd">
      <span class="wk-day-name ${isToday?'today':''} ${isPast&&!isToday?'past':''}">${dayNames[i]}</span>
      <span class="wk-day-date">${dateLabel}</span>
      ${dayTasks.length > 0 ? `<span class="wk-day-cnt">${doneCnt}/${dayTasks.length}</span>` : ''}
    </div>`;

    if (dayTasks.length === 0) {
      daysHtml += `<div class="wk-day-empty">暂无任务</div>`;
    } else {
      dayTasks.forEach(t => {
        const hasTime = t.dt && t.dt.includes('T');
        let timeStr = '';
        if (hasTime) {
          const dtObj = new Date(t.dt);
          timeStr = `${p2(dtObj.getHours())}:${p2(dtObj.getMinutes())}`;
          if (t.dtEnd && t.dtEnd.includes('T')) {
            const eObj = new Date(t.dtEnd);
            timeStr += `-${p2(eObj.getHours())}:${p2(eObj.getMinutes())}`;
          }
        }
        const priColor = {none:'#aaa',low:'#48bb78',mid:'#f6ad55',high:'#fc8181'}[t.priority||'none'];
        daysHtml += `<div class="wk-task-row ${t.done?'done':''}" onclick="showEditModal('${t.id}')">
          <div class="wk-task-check ${t.done?'checked':''}" onclick="event.stopPropagation();toggleDone('${t.id}')"></div>
          <div style="width:4px;height:4px;border-radius:50%;background:${priColor};flex-shrink:0"></div>
          ${timeStr ? `<div class="wk-task-time" style="margin-right:6px">${timeStr}</div>` : ''}
          <div class="wk-task-title">${escHtml(t.title)}</div>
        </div>`;
      });
    }
    daysHtml += `</div>`;
  });

  main.innerHTML = navHtml + summaryHtml + `<div class="wk-days-wrap">${daysHtml}</div>`;
}
function toggleDone(id) {
  const t = tasks.find(x => x.id === id);

  renderWeekView();

}

function initDrag() {
  const list = document.getElementById('task-list');
  if(!list) return;
  list.addEventListener('dragstart', e => {
    const item = e.target.closest('.task-item');
    if(!item) return;
    dragSrcId = item.dataset.id;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(()=>item.style.opacity='0.4', 0);
  });
  list.addEventListener('dragend', e => {
    const item = e.target.closest('.task-item');
    if(item) item.style.opacity='';
    list.querySelectorAll('.task-item').forEach(el=>el.classList.remove('drag-over'));
  });
  list.addEventListener('dragover', e => {
    e.preventDefault();
    const item = e.target.closest('.task-item');
    list.querySelectorAll('.task-item').forEach(el=>el.classList.remove('drag-over'));
    if(item && item.dataset.id !== dragSrcId) item.classList.add('drag-over');
    e.dataTransfer.dropEffect = 'move';
  });
  list.addEventListener('drop', e => {
    e.preventDefault();
    const item = e.target.closest('.task-item');
    if(!item || item.dataset.id === dragSrcId) return;
    // 重新排序 tasks 数组
    const srcIdx = tasks.findIndex(t=>String(t.id)===String(dragSrcId));
    const dstIdx = tasks.findIndex(t=>String(t.id)===String(item.dataset.id));
    if(srcIdx<0||dstIdx<0) return;
    const [moved] = tasks.splice(srcIdx, 1);
    tasks.splice(dstIdx, 0, moved);
    save();
    render();
  });
}

    tv.style.display = 'none'; nv.style.display = 'none'; nev.style.display = 'none'; gv.style.display = 'flex';

function confirmList() {
  const name = document.getElementById('list-name-input').value.trim();
  if (!name) { hideListModal(); return; }
  const color = getSelectedColor();
  if (editingListId) {
    const l = lists.find(l => l.id === editingListId);
    if (l) { l.name = name; l.color = color; }
  } else {
    const newId = 'list_' + Date.now();
    lists.push({ id: newId, name, color });
    // 切换到新建的清单
    addListId = newId;
  }
  save(); hideListModal(); render();
}
function deleteList() {
  if (!editingListId) return;
  if (!confirm('确定要删除这个清单吗？清单内的任务将移至「默认」。')) return;
  tasks = tasks.map(t => t.listId === editingListId ? {...t, listId:'default'} : t);
  lists = lists.filter(l => l.id !== editingListId);
  if (curView === `list:${editingListId}`) curView = 'today';
  if (addListId === editingListId) addListId = lists[0]?.id || 'default';
  save(); hideListModal(); render();
}

function renderNotes() {
  const meta = document.getElementById('notes-meta');
  if (meta) meta.textContent = `共 ${notes.length} 条笔记`;
  const container = document.getElementById('notes-list');
  if (!notes.length) {
    container.innerHTML = `<div class="empty"><div class="ei">📝</div><div class="et">Notes 是空的</div><div class="es">点击下方按钮添加笔记</div></div>
      <button class="add-note-btn" onclick="openNoteEditor(null)">＋ 新建笔记</button>`;
    return;
  }
  container.innerHTML = notes.map(n => {
    const bodyPreview = (n.body || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g,' ').trim().slice(0, 100);
    return `<div class="note-card" onclick="openNoteEditor('${n.id}')">
      <button class="note-del" onclick="event.stopPropagation();deleteNoteById('${n.id}')">✕</button>
      <h3>${escHtml(n.title||'无标题')}</h3>
      <p>${escHtml(bodyPreview)}</p>
      <div class="note-meta">${n.updatedAt||n.createdAt||''}</div>
    </div>`;
  }).join('') + `<button class="add-note-btn" onclick="openNoteEditor(null)">＋ 新建笔记</button>`;
}
function openNoteEditor(id) {
  editingNoteId = id;
  const n = id ? notes.find(n => n.id === id) : null;
  document.getElementById('note-title-input').value = n ? n.title : '';
  document.getElementById('note-body-editor').innerHTML = n ? (n.body || '') : '';
  document.getElementById('notes-view').style.display = 'none';
  document.getElementById('note-editor-view').style.display = 'flex';
  setTimeout(() => document.getElementById(id ? 'note-body-editor':'note-title-input').focus(), 50);
}
function saveNote() {
  const title = document.getElementById('note-title-input').value.trim() || '无标题';
  const body  = document.getElementById('note-body-editor').innerHTML;
  const d = new Date();
  const ds = `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  if (editingNoteId) {
    const n = notes.find(n => n.id === editingNoteId);
    if (n) { n.title = title; n.body = body; n.updatedAt = ds; }
  } else {
    notes.unshift({ id:'note_'+Date.now(), title, body, createdAt: ds, updatedAt: ds });
  }
  save(); backToNotes();
}
function rtCmd(cmd, val) {
  document.getElementById('note-body-editor').focus();
  document.execCommand(cmd, false, val || null);
}
function rtHeading(level) {
  document.getElementById('note-body-editor').focus();
  document.execCommand('formatBlock', false, 'h' + level);
}
function rtLink() {
  const url = prompt('输入链接地址：');
  if(url) document.execCommand('createLink', false, url);
}
function deleteNote() {
  if (!editingNoteId) return;
  if (!confirm('确定删除这条资料？')) return;
  deleteNoteById(editingNoteId); backToNotes();
}
function deleteNoteById(id) {
  notes = notes.filter(n => n.id !== id); save(); renderNotes();
}
function backToNotes() {
  editingNoteId = null;
  document.getElementById('note-editor-view').style.display = 'none';
  document.getElementById('notes-view').style.display = 'flex';
  renderNotes();
}

// ══════════════════════════════════════
// TAGS
// ══════════════════════════════════════
let tagFilter = ''; // current active tag filter

// Parse tags from title: extract #tag occurrences
function parseTags(title) {
  const matches = title.match(/#([^#\s]+)/g);
  if (!matches) return [];
  return matches.map(t => t.slice(1));
}

// Clean tags from title (remove #tag)
function cleanTitle(title) {
  return title.replace(/\s*#([^#\s]+)/g, '').trim();
}

// Get all unique tags from tasks
function getAllTags() {
  const tagSet = new Set();
  tasks.forEach(t => {
    const tags = t.tags || parseTags(t.title);
    tags.forEach(tag => tagSet.add(tag));
  });
  return Array.from(tagSet).sort();
}

// Render tag filter bar
function renderTagFilter() {
  const bar = document.getElementById('tag-filter-bar');
  if (!bar) return;
  const allTags = getAllTags();
  if (allTags.length === 0) { bar.innerHTML = ''; return; }
  bar.innerHTML = allTags.map(tag =>
    `<span class="tag-filter-chip ${tagFilter === tag ? 'active' : ''}" onclick="toggleTagFilter('${escHtml(tag)}')">#${escHtml(tag)}</span>`
  ).join('');
}

function toggleTagFilter(tag) {
  tagFilter = tagFilter === tag ? '' : tag;
  render();
}

// Preview tags in edit modal
function previewEditTags() {
  const input = document.getElementById('edit-tags');
  const preview = document.getElementById('edit-tags-preview');
  if (!input || !preview) return;
  const tags = parseTags('#' + input.value.replace(/#/g, ' #'));
  preview.innerHTML = tags.map(t => `<span class="t-tag">#${escHtml(t)}</span>`).join('');
}

// ══════════════════════════════════════
function checkDueToday() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') {
    Notification.requestPermission();
  }
  if (Notification.permission !== 'granted') return;
  const today = todayStr();
  const dueToday = tasks.filter(t => !t.done && t.dt && t.dt.startsWith(today));
  if (dueToday.length > 0) {
    new Notification('Todo 提醒', {
      body: `今天有 ${dueToday.length} 个任务到期`,
      icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><text y="20" font-size="20">✅</text></svg>'
    });
  }
}

  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  a.href = url;
  a.download = `todo-backup-${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}.json`;

function onImportFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.tasks && !data.lists) {
        alert('无效的备份文件');
        return;
      }
      if (!confirm('导入将覆盖当前所有数据，确定继续吗？')) return;
      if (data.tasks) { tasks = data.tasks; localStorage.setItem('td_tasks', JSON.stringify(tasks)); }
      if (data.lists) { lists = data.lists; localStorage.setItem('td_lists', JSON.stringify(lists)); }
      if (data.notes) { notes = data.notes; localStorage.setItem('td_notes', JSON.stringify(notes)); }
      if (data.goals) { goals = data.goals; localStorage.setItem('td_goals', JSON.stringify(goals)); }
      if (data.goalsV2) { goalsV2 = data.goalsV2; localStorage.setItem('td_goalsv2', JSON.stringify(goalsV2)); }
      if (data.goalsNG) { goalsNG = data.goalsNG; localStorage.setItem('td_goals_ng', JSON.stringify(goalsNG)); }
      if (data.goalsColBg) { goalsColBg = data.goalsColBg; localStorage.setItem('td_goals_col_bg', JSON.stringify(goalsColBg)); }
      if (data.stickyPad) localStorage.setItem('td_sticky_pad', data.stickyPad);
      if (data.richNote) localStorage.setItem('td_rich_note', data.richNote);
      if (data.appName) { appName = data.appName; localStorage.setItem('td_appname', appName); }
      if (data.listsLabel) { listsLabel = data.listsLabel; localStorage.setItem('td_listslabel', listsLabel); }
      loadStickyPad();
      richLoad();
      render();
      alert('导入成功！');
    } catch(err) {
      alert('导入失败：' + err.message);
    }
  };
  reader.readAsText(file);
  input.value = ''; // reset for re-import
}

// ── 右侧富文本记录区 ──
const RICH_KEY = 'td_rich_note';
let richSaveTimer = null;

function richLoad() {
  const ed = document.getElementById('rich-editor');
  if (!ed) return;
  const saved = localStorage.getItem(RICH_KEY);
  if (saved) ed.innerHTML = saved;
}

function richSave() {
  const ed = document.getElementById('rich-editor');
  const st = document.getElementById('rich-status');
  if (!ed) return;
  clearTimeout(richSaveTimer);
  if (st) st.textContent = '正在保存…';
  richSaveTimer = setTimeout(() => {
    localStorage.setItem(RICH_KEY, ed.innerHTML);
    if (st) st.textContent = '已自动保存 ' + new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  }, 600);
}

function richCmd(cmd, val) {
  document.getElementById('rich-editor').focus();
  document.execCommand(cmd, false, val || null);
  richSave();
}

function richBlock(tag) {
  const ed = document.getElementById('rich-editor');
  ed.focus();
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  // find block ancestor
  let node = range.commonAncestorContainer;
  while (node && node !== ed && node.nodeType !== 1) node = node.parentNode;
  if (!node || node === ed) {
    // wrap selection in tag
    const el = document.createElement(tag);
    try { range.surroundContents(el); } catch(e) { document.execCommand('formatBlock', false, tag); }
  } else {
    // toggle: if already same tag, convert to p
    if (node.tagName && node.tagName.toLowerCase() === tag) {
      document.execCommand('formatBlock', false, 'p');
    } else {
      document.execCommand('formatBlock', false, tag);
    }
  }
  richSave();
}

function richInsertCheckbox() {
  const ed = document.getElementById('rich-editor');
  ed.focus();
  // find or create cb-list before cursor
  const sel = window.getSelection();
  const id = 'cb_' + Date.now();
  const html = `<ul class="cb-list"><li class="cb-item" data-cbid="${id}"><input type="checkbox" id="${id}" onchange="richCbToggle(this)"><span contenteditable="true" placeholder="待办项…">待办项</span></li></ul><p><br></p>`;
  document.execCommand('insertHTML', false, html);
  // select the span text for immediate editing
  setTimeout(() => {
    const span = ed.querySelector(`[data-cbid="${id}"] span`);
    if (span) {
      const r = document.createRange();
      r.selectNodeContents(span);
      const s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
    }
  }, 0);
  richSave();
}

function richCbToggle(cb) {
  const item = cb.closest('.cb-item');
  if (!item) return;
  if (cb.checked) {
    item.classList.add('cb-done');
    // move to end of parent list
    const list = item.closest('.cb-list');
    if (list) list.appendChild(item);
  } else {
    item.classList.remove('cb-done');
    // move back before first done item
    const list = item.closest('.cb-list');
    if (list) {
      const firstDone = list.querySelector('.cb-item.cb-done');
      if (firstDone && firstDone !== item) list.insertBefore(item, firstDone);
    }
  }
  richSave();
}

function richInsertLink() {
  const ed = document.getElementById('rich-editor');
  ed.focus();
  const sel = window.getSelection();
  const selectedText = sel && sel.toString().trim();
  const url = prompt('输入链接地址：', 'https://');
  if (!url || url === 'https://') return;
  if (selectedText) {
    // wrap selected text as link
    document.execCommand('createLink', false, url);
  } else {
    // no selection: insert link with URL as text
    const a = `<a href="${url}" target="_blank" rel="noopener">${url}</a>`;
    document.execCommand('insertHTML', false, a);
  }
  richSave();
}

function richKeydown(e) {
  // Tab → indent
  if (e.key === 'Tab') {
    e.preventDefault();
    document.execCommand('insertHTML', false, '&nbsp;&nbsp;&nbsp;&nbsp;');
  }
}

// init rich editor on load
document.addEventListener('DOMContentLoaded', richLoad);
// also load right away in case DOMContentLoaded already fired
if (document.readyState !== 'loading') richLoad();
