<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Todo · 我的清单</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--sb:#f7f7f5;--sb-hover:#ebebea;--sb-active:#e3e2de;
  --text:#1a1a1a;--t2:#6b6b6b;--t3:#aaa;--border:#e9e9e7;
  --hover:#fafaf9;--accent:#2383e2;
  --high:#e03e2d;--high-bg:#fdf1f0;
  --mid:#d97706;--mid-bg:#fffbeb;
  --low:#16a34a;--low-bg:#f0fdf4;
  --none:#999;--none-bg:#f5f5f5;
  --r:8px;--r-sm:6px;--r-lg:12px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
}
body{font-family:var(--font);background:var(--bg);display:flex;height:100vh;overflow:hidden;color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ── SIDEBAR ── */
.sidebar{width:240px;background:var(--sb);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 0 12px;flex-shrink:0;overflow:hidden}
.ws{display:flex;align-items:center;gap:8px;padding:4px 14px 14px;font-weight:700;font-size:14px;border-bottom:1px solid var(--border);margin-bottom:6px}
.ws-icon{width:28px;height:28px;background:var(--text);color:#fff;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.sb-sec{font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--t3);padding:10px 14px 3px;text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer;font-size:13.5px;color:var(--t2);transition:background .1s;user-select:none;border-radius:6px;margin:1px 6px}
.sb-item:hover{background:var(--sb-hover);color:var(--text)}
.sb-item.active{background:var(--sb-active);color:var(--text);font-weight:500}
.sb-item .si{font-size:15px;width:20px;text-align:center;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sb-item .sc{margin-left:auto;font-size:11px;color:var(--t3);background:var(--sb-active);border-radius:10px;padding:0 6px;min-width:18px;text-align:center;display:none}
.sb-item .sc.visible{display:block}
.sb-item.active .sc{color:var(--t2)}

.sb-lists{padding:0 8px;overflow-y:auto;max-height:200px;flex-shrink:0}
.sb-list-item{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 12px;cursor:pointer;font-size:13.5px;color:var(--t2);transition:background .1s;user-select:none;border-radius:6px;margin:1px 6px}
.sb-list-item:hover{background:var(--sb-hover);color:var(--text)}
.sb-list-item.active{background:var(--sb-active);color:var(--text);font-weight:500}
.sb-list-item.list-drag-over{border-top:2px solid var(--accent)}
.sb-list-item .li-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.sb-list-item .li-cnt{margin-left:auto;font-size:11px;color:var(--t3);flex-shrink:0}
.sb-list-item .li-edit-btn{opacity:0;background:none;border:none;font-size:0;color:var(--t3);cursor:pointer;padding:2px 4px;border-radius:4px;line-height:1;transition:opacity .1s;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sb-list-item:hover .li-edit-btn{opacity:1}
.sb-list-item .li-edit-btn:hover{color:var(--text);background:var(--sb-active)}

.new-list-btn{margin:4px 10px 0;padding:6px 10px;background:transparent;border:none;color:var(--t3);border-radius:var(--r-sm);cursor:pointer;font-size:13px;font-family:var(--font);transition:all .15s;display:flex;align-items:center;gap:6px;width:calc(100% - 20px)}
.new-list-btn:hover{background:var(--sb-hover);color:var(--t2)}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.header{padding:18px 44px 0;flex-shrink:0;position:relative;background-size:cover;background-position:center;border-radius:0 0 12px 12px;transition:background .3s}
.header-has-bg{padding-bottom:24px}
.header-bg-btn{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.75);backdrop-filter:blur(4px);border:1px solid rgba(0,0,0,.1);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--text);cursor:pointer;opacity:0;transition:opacity .15s;display:flex;align-items:center;gap:5px;font-family:var(--font)}
.header:hover .header-bg-btn{opacity:1}
.header-bg-panel{position:absolute;top:40px;right:12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 4px 20px rgba(0,0,0,.12);z-index:300;padding:14px 16px;width:260px;display:none}
.header-bg-panel.open{display:block}
.hbp-label{font-size:11px;color:var(--t3);font-weight:600;margin-bottom:8px;letter-spacing:.03em}
.hbp-colors{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.hbp-color{width:28px;height:28px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:all .12s}
.hbp-color:hover,.hbp-color.active{border-color:var(--text);transform:scale(1.1)}
.hbp-upload-row{display:flex;gap:8px;align-items:center}
.hbp-upload-btn{flex:1;border:1.5px dashed var(--border);border-radius:6px;padding:7px;font-size:12px;color:var(--t3);text-align:center;cursor:pointer;font-family:var(--font);background:none;transition:all .12s}
.hbp-upload-btn:hover{border-color:#aaa;color:var(--text)}
.hbp-clear{border:1px solid var(--border);background:none;border-radius:6px;padding:7px 12px;font-size:12px;color:var(--t3);cursor:pointer;font-family:var(--font);transition:all .12s}
.hbp-clear:hover{color:#e03e2d;border-color:#e03e2d}
.header h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
.header .meta{font-size:13px;color:var(--t3);margin-top:3px}
.header .motto{font-size:13px;color:var(--t2);margin-top:5px;font-style:italic;opacity:.8;line-height:1.5}
/* ── ADD BAR ── */
.add-wrap{padding:16px 44px 0;flex-shrink:0}
.add-wrap.hidden{display:none}
.add-bar{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:var(--r);background:var(--bg);transition:border-color .15s,box-shadow .15s;gap:0}
.add-bar:focus-within{border-color:#bbb;box-shadow:0 0 0 3px rgba(0,0,0,.05)}
.add-plus{padding:0 10px 0 14px;color:var(--t3);font-size:18px;flex-shrink:0;line-height:1}
.add-task-input{flex:1;border:none;outline:none;font-size:14px;font-family:var(--font);background:transparent;color:var(--text);padding:11px 8px 11px 0;min-width:0}
.add-task-input::placeholder{color:var(--t3)}
.add-sep{width:1px;height:22px;background:var(--border);flex-shrink:0}

/* ── 优先级自定义下拉 ── */
.prio-wrapper{position:relative;flex-shrink:0}
.prio-trigger{display:flex;align-items:center;gap:5px;padding:0 12px;height:44px;cursor:pointer;font-size:13px;color:var(--t2);user-select:none;white-space:nowrap}
.prio-trigger:hover{color:var(--text)}
.prio-trigger .prio-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.prio-dropdown{position:absolute;top:calc(100% + 4px);left:0;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 4px 16px rgba(0,0,0,.1);z-index:200;min-width:110px;padding:4px 0;display:none}
.prio-dropdown.open{display:block}
.prio-opt{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;font-size:13px;color:var(--text);transition:background .1s}
.prio-opt:hover{background:var(--sb-hover)}
.prio-opt .prio-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.prio-opt.selected{background:var(--sb-active)}

/* ── 日期按钮（只显示日历图标）── */
.dt-wrapper{position:relative;flex-shrink:0}
.dt-trigger{display:flex;align-items:center;gap:5px;padding:0 12px;height:44px;cursor:pointer;font-size:13px;color:var(--t2);user-select:none;white-space:nowrap}
.dt-trigger:hover{color:var(--text)}
.dt-trigger .dt-icon{font-size:16px;line-height:1;display:flex;align-items:center}
.dt-trigger .dt-label{font-size:12.5px;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.dt-popup{position:absolute;top:calc(100% + 4px);right:0;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 4px 16px rgba(0,0,0,.1);z-index:200;padding:14px 16px;display:none;min-width:420px}
.dt-popup.open{display:block}
.dt-popup label{font-size:11.5px;color:var(--t3);display:block;margin-bottom:5px;font-weight:500}
.dt-popup input[type="date"]{width:100%;border:1.5px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;font-family:var(--font);outline:none;color:var(--text);margin-bottom:10px}
.dt-popup input[type="date"]:focus{border-color:#aaa}
.time-scroller{display:flex;gap:8px;margin-bottom:10px;height:160px}
.time-col{flex:1;overflow-y:auto;border:1px solid var(--border);border-radius:6px;scroll-snap-type:y mandatory}
.time-col::-webkit-scrollbar{width:0}
.time-slot{height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--t2);cursor:pointer;scroll-snap-align:start;transition:all .1s;user-select:none}
.time-slot:hover{background:var(--sb-hover);color:var(--text)}
.time-slot.selected{background:var(--text);color:#fff;font-weight:500;border-radius:4px}
.time-col-label{font-size:11px;color:var(--t3);text-align:center;margin-bottom:3px;font-weight:500}
.dt-actions{display:flex;gap:6px;justify-content:flex-end}
.dt-actions button{padding:5px 12px;border-radius:5px;border:none;font-size:12.5px;font-family:var(--font);cursor:pointer;font-weight:500}
.dt-clear{background:var(--sb-hover);color:var(--t2)}
.dt-ok{background:var(--text);color:#fff}

/* ── 清单选择 ── */
.list-sel-wrap{position:relative;flex-shrink:0}
.list-sel-trigger{display:flex;align-items:center;gap:5px;padding:0 10px;height:44px;cursor:pointer;font-size:13px;color:var(--t2);user-select:none;white-space:nowrap;max-width:100px;overflow:hidden}
.list-sel-trigger:hover{color:var(--text)}
.list-sel-trigger .ls-icon{font-size:14px;flex-shrink:0}
.list-sel-trigger .ls-name{overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.list-sel-dd{position:absolute;top:calc(100% + 4px);right:0;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 4px 16px rgba(0,0,0,.1);z-index:200;padding:4px 0;display:none;min-width:120px}
.list-sel-dd.open{display:block}
.list-sel-opt{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;font-size:13px;color:var(--text);transition:background .1s}
.list-sel-opt:hover{background:var(--sb-hover)}
.list-sel-opt.selected{background:var(--sb-active)}

/* ── 循环选择 ── */
.repeat-wrap{position:relative;flex-shrink:0}
.repeat-trigger{display:flex;align-items:center;gap:4px;padding:0 10px;height:44px;cursor:pointer;font-size:13px;color:var(--t2);user-select:none;white-space:nowrap}
.repeat-trigger:hover{color:var(--text)}
.repeat-trigger .rpt-icon{font-size:14px;display:flex;align-items:center}
.repeat-trigger .rpt-label{font-size:12px}
.repeat-dd{position:absolute;top:calc(100% + 4px);right:0;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 4px 16px rgba(0,0,0,.1);z-index:200;padding:4px 0;display:none;min-width:120px}
.repeat-dd.open{display:block}
.repeat-opt{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;font-size:13px;color:var(--text);transition:background .1s}
.repeat-opt:hover{background:var(--sb-hover)}
.repeat-opt.selected{background:var(--sb-active)}

.custom-repeat-panel{position:absolute;top:calc(100% + 4px);right:0;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 4px 16px rgba(0,0,0,.1);z-index:200;padding:14px 16px;display:none;min-width:260px}
.custom-repeat-panel.open{display:block}
.crp-label{font-size:11.5px;color:var(--t3);font-weight:500;margin-bottom:6px}
.crp-unit-row{display:flex;gap:6px;margin-bottom:10px}
.crp-unit-btn{flex:1;padding:6px 4px;border:1.5px solid var(--border);border-radius:6px;font-size:12.5px;text-align:center;cursor:pointer;color:var(--t2);transition:all .1s;background:transparent;font-family:var(--font)}
.crp-unit-btn:hover{border-color:#bbb;color:var(--text)}
.crp-unit-btn.active{border-color:var(--text);background:var(--text);color:#fff}
.crp-num-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.crp-num{width:28px;height:28px;border:1px solid var(--border);border-radius:5px;font-size:12px;text-align:center;line-height:28px;cursor:pointer;color:var(--t2);transition:all .1s}
.crp-num:hover{border-color:#bbb;color:var(--text)}
.crp-num.active{background:var(--text);color:#fff;border-color:var(--text)}
.crp-week-row{display:flex;gap:4px;margin-bottom:10px}
.crp-wd{width:30px;height:30px;border:1px solid var(--border);border-radius:50%;font-size:11.5px;text-align:center;line-height:30px;cursor:pointer;color:var(--t2);transition:all .1s}
.crp-wd:hover{border-color:#bbb;color:var(--text)}
.crp-wd.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.crp-actions{display:flex;gap:6px;justify-content:flex-end}
.crp-actions button{padding:5px 12px;border-radius:5px;border:none;font-size:12.5px;font-family:var(--font);cursor:pointer;font-weight:500}
.crp-row{display:flex;align-items:center;gap:8px}
.crp-label-inline{font-size:12px;color:var(--t3);flex-shrink:0}
.crp-n-input{width:52px;border:1.5px solid var(--border);border-radius:5px;padding:5px 8px;font-size:13px;font-family:var(--font);outline:none;text-align:center}
.crp-unit-sel{border:1.5px solid var(--border);border-radius:5px;padding:5px 8px;font-size:13px;font-family:var(--font);outline:none;background:var(--bg);cursor:pointer}
.crp-end-date{flex:1;border:1.5px solid var(--border);border-radius:5px;padding:5px 8px;font-size:12px;font-family:var(--font);outline:none;color:var(--text)}

.add-btn{margin:5px 6px 5px 4px;background:var(--text);color:#fff;border:none;border-radius:var(--r-sm);padding:7px 18px;font-size:13px;font-weight:500;font-family:var(--font);cursor:pointer;transition:opacity .15s;white-space:nowrap;flex-shrink:0}
.add-btn:hover{opacity:.8}

/* ── FILTERS ── */
.filters{padding:12px 44px 0;display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0}
.chip{padding:4px 13px;border-radius:20px;font-size:12.5px;border:1px solid var(--border);cursor:pointer;background:transparent;color:var(--t2);transition:all .12s;user-select:none;font-family:var(--font)}
.chip:hover{background:var(--sb-hover);color:var(--text);border-color:#ccc}
.chip.active{background:var(--text);color:#fff;border-color:var(--text);font-weight:500}
.divider{margin:12px 44px 0;height:1px;background:var(--border);flex-shrink:0}

/* ── TASK LIST ── */
.task-list{overflow-y:auto;padding:4px 44px 40px}
.task-list,.notes-wrap{flex:1}

.section-label{font-size:11.5px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;padding:16px 0 6px}

.task-item{display:flex;align-items:flex-start;gap:10px;padding:9px 6px 9px 2px;border-radius:var(--r);transition:background .1s;cursor:default}
.task-item:hover{background:var(--hover)}
.task-item+.task-item{border-top:1px solid var(--border)}
.task-item:hover+.task-item{border-top-color:transparent}
.task-item.done-item{opacity:.4}

.t-check{width:18px;height:18px;border-radius:50%;border:1.5px solid #ccc;cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:10px;color:#fff}
.t-check:hover{border-color:#888}
.t-check.checked{background:#888;border-color:#888}

.t-body{flex:1;min-width:0}
.t-title{font-size:14px;color:var(--text);line-height:1.55;word-break:break-word}
.task-item.done-item .t-title{text-decoration:line-through;color:var(--t3)}
.t-body-preview{font-size:12px;color:var(--t3);margin-top:2px;line-height:1.5;white-space:pre-wrap;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.t-title-input{font-size:14px;font-family:var(--font);border:none;outline:none;background:transparent;color:var(--text);width:100%;border-bottom:1.5px solid var(--accent);padding:1px 0}
.t-meta{display:flex;gap:6px;margin-top:3px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 7px;border-radius:4px;font-weight:600;display:flex;align-items:center;gap:3px}
.tag .td{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.tag-high{background:var(--high-bg);color:var(--high)}
.tag-mid{background:var(--mid-bg);color:var(--mid)}
.tag-low{background:var(--low-bg);color:var(--low)}
.tag-none{background:var(--none-bg);color:var(--none)}
.tag-date{font-size:12px;color:var(--t3);display:flex;align-items:center;gap:3px}
.tag-date.overdue{color:var(--high);font-weight:500}
.tag-list{font-size:11.5px;color:var(--t3)}
.tag-repeat{font-size:11px;color:#8b5cf6;background:#f5f3ff;padding:2px 6px;border-radius:4px;display:flex;align-items:center;gap:2px}

.t-title-row{display:flex;align-items:center;gap:4px;min-width:0}
.t-title-row .t-title{flex:1;min-width:0}
.t-actions{display:flex;gap:1px;flex-shrink:0;opacity:0;transition:opacity .12s}
.task-item:hover .t-actions{opacity:1}
.t-btn{background:none;border:none;color:var(--t3);cursor:pointer;font-size:13px;padding:3px 5px;border-radius:4px;line-height:1;transition:color .1s,background .1s}
.t-btn:hover{color:var(--text);background:var(--sb-active)}
.t-btn.del:hover{color:var(--high);background:var(--high-bg)}
.t-act-btn{background:none;border:none;cursor:pointer;color:var(--t3);padding:4px 6px;border-radius:4px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.t-act-btn:hover{background:var(--sb-hover);color:var(--text)}
.t-act-btn.t-act-del:hover{color:#e03e2d}

/* ── EMPTY ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 0;color:var(--t3);gap:8px}
.empty .ei{font-size:32px;opacity:.4;margin-bottom:4px}
.empty .et{font-size:14px;font-weight:500;color:var(--t2)}
.empty .es{font-size:13px}

/* ── MODALS ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;z-index:500;backdrop-filter:blur(2px)}
.modal{background:var(--bg);border-radius:var(--r-lg);padding:24px;width:380px;box-shadow:0 8px 40px rgba(0,0,0,.13),0 0 0 1px rgba(0,0,0,.05)}
.modal h2{font-size:16px;font-weight:600;margin-bottom:16px}
.modal label{font-size:12.5px;color:var(--t2);display:block;margin-bottom:5px;font-weight:500}
.modal input[type="text"],.modal textarea,.modal select{width:100%;border:1.5px solid var(--border);border-radius:var(--r);padding:9px 12px;font-size:14px;font-family:var(--font);outline:none;color:var(--text);transition:border-color .15s;margin-bottom:14px;background:var(--bg)}
.modal textarea{resize:vertical;min-height:90px}
.modal input[type="text"]:focus,.modal textarea:focus,.modal select:focus{border-color:#aaa}
.icon-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:14px}
.icon-opt{width:32px;height:32px;border-radius:50% !important;border:3px solid transparent;cursor:pointer;transition:all .1s;transform:scale(0.85)}
.icon-opt:hover{transform:scale(1)}
.icon-opt.selected{transform:scale(1);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.modal-actions button{padding:7px 16px;border-radius:var(--r-sm);border:none;cursor:pointer;font-size:13.5px;font-family:var(--font);font-weight:500;transition:opacity .15s}
.btn-cancel{background:var(--sb-hover);color:var(--t2)}
.btn-cancel:hover{background:var(--sb-active);opacity:1}
.btn-confirm{background:var(--text);color:#fff}
.btn-confirm:hover{opacity:.8}
.btn-danger{background:var(--high-bg);color:var(--high)}
.btn-danger:hover{background:#fce4e2;opacity:1}

/* ── 编辑任务弹窗 ── */
.edit-modal{width:min(520px,92vw);max-height:90vh;overflow-y:auto}
.edit-row{display:flex;gap:10px;margin-bottom:12px}
.edit-row > div{flex:1}
.edit-row label{font-size:12px;color:var(--t3);display:block;margin-bottom:4px;font-weight:500}
.edit-row select,.edit-row input{width:100%;border:1.5px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;font-family:var(--font);outline:none;background:var(--bg);color:var(--text);margin-bottom:0}
.edit-row select:focus,.edit-row input:focus{border-color:#aaa}

/* ── NOTES ── */
.notes-wrap{overflow-y:auto;padding:4px 44px 40px;display:flex;flex-direction:column;gap:12px}
.note-card{background:var(--hover);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:box-shadow .15s;position:relative}
.note-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.07)}
.note-card h3{font-size:14px;font-weight:600;margin-bottom:4px}
.note-card p{font-size:13px;color:var(--t2);line-height:1.55;white-space:pre-wrap;word-break:break-word;max-height:60px;overflow:hidden}
.note-card .note-meta{font-size:11.5px;color:var(--t3);margin-top:8px}
.note-del{position:absolute;top:10px;right:10px;opacity:0;background:none;border:none;font-size:16px;color:var(--t3);cursor:pointer;padding:2px 5px;border-radius:4px;transition:opacity .1s}
.note-card:hover .note-del{opacity:1}
.note-del:hover{color:var(--high);background:var(--high-bg)}
.add-note-btn{align-self:flex-start;padding:8px 18px;background:var(--text);color:#fff;border:none;border-radius:var(--r-sm);font-size:13px;font-weight:500;font-family:var(--font);cursor:pointer;transition:opacity .15s}
.add-note-btn:hover{opacity:.8}
.note-editor{flex:1;display:flex;flex-direction:column;padding:8px 44px 32px;gap:10px;overflow:hidden}
.note-editor input{font-size:20px;font-weight:600;border:none;outline:none;font-family:var(--font);color:var(--text);border-bottom:1px solid var(--border);padding:6px 0 10px;flex-shrink:0}
.note-editor textarea{flex:1;border:none;outline:none;font-family:var(--font);font-size:14px;color:var(--text);resize:none;line-height:1.7;padding:4px 0}
.note-toolbar{display:flex;gap:8px;align-items:center;flex-shrink:0}
.note-toolbar button{padding:6px 14px;border-radius:var(--r-sm);border:none;font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer}
.note-back{background:var(--sb-hover);color:var(--t2)}
.note-save{background:var(--text);color:#fff}
.note-toolbar-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.note-rtb{display:flex;align-items:center;gap:2px;flex-wrap:wrap;padding:6px 8px;background:var(--hover);border-radius:6px;border:1px solid var(--border)}
.rtb-btn{border:none;background:none;padding:4px 7px;border-radius:4px;cursor:pointer;font-size:13px;font-family:var(--font);color:var(--text);min-width:28px;transition:background .1s}
.rtb-btn:hover{background:var(--border)}
.rtb-sep{width:1px;height:18px;background:var(--border);margin:0 3px}
.note-body-editor{flex:1;outline:none;font-size:14px;font-family:var(--font);color:var(--text);line-height:1.7;padding:8px 0;overflow-y:auto;min-height:300px;word-break:break-word}
.note-body-editor:empty:before{content:attr(data-placeholder);color:var(--t3);pointer-events:none}
.note-body-editor h1{font-size:20px;font-weight:700;margin:12px 0 4px}
.note-body-editor h2{font-size:16px;font-weight:600;margin:10px 0 4px}
.note-body-editor h3{font-size:14px;font-weight:600;margin:8px 0 4px}
.note-body-editor a{color:var(--accent);text-decoration:underline}
.note-body-editor ul,.note-body-editor ol{padding-left:20px}

/* ── VIEW panels ── */
#task-view{display:flex;flex-direction:column;flex:1;overflow:hidden}
#notes-view{display:none;flex-direction:column;flex:1;overflow:hidden}
#note-editor-view{display:none;flex-direction:column;flex:1;overflow:hidden}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#bbb}

/* ── WEEK VIEW ── */
.week-summary{font-size:13px;color:var(--text);font-weight:600;margin-bottom:16px;line-height:1.6}
.week-timeline{display:flex;overflow:auto;max-height:calc(100vh - 220px);position:relative}
.wt-time-axis{width:44px;flex-shrink:0;padding-top:36px;/* 36px为列头高度 */}
.wt-time-slot{height:48px;display:flex;align-items:flex-start;font-size:10px;color:var(--t3);padding-right:6px;text-align:right;box-sizing:border-box;justify-content:flex-end}
.wt-cols-area{flex:1;display:flex;flex-direction:column;min-width:0}
.wt-col-hds{display:grid;grid-template-columns:repeat(7,1fr);position:sticky;top:0;background:var(--bg);z-index:2;border-bottom:1px solid var(--border)}
.wt-col-hd{text-align:center;padding:6px 4px;font-size:11px;font-weight:600;color:var(--t3)}
.wt-col-hd.today{color:var(--accent)}
.wt-cols-body{display:grid;grid-template-columns:repeat(7,1fr);position:relative;flex:1}
.wt-col{position:relative;border-right:1px solid var(--border)}
.wt-col:last-child{border-right:none}
.wt-hour-line{position:absolute;left:0;right:0;height:1px;background:var(--border);pointer-events:none}
.wt-task{position:absolute;left:2px;right:2px;border-radius:4px;padding:2px 5px;font-size:11px;cursor:pointer;overflow:hidden;box-sizing:border-box;min-height:18px;transition:opacity .1s}
.wt-task:hover{opacity:.85;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.wt-task.done{opacity:.4;text-decoration:line-through}
.wt-task-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;line-height:1.3}
.wt-task-time{font-size:9px;opacity:.8;line-height:1.2}
.wt-task.high{background:#ffeaea;border-left:3px solid var(--c-high);color:#c0392b}
.wt-task.mid{background:#fff8e6;border-left:3px solid var(--c-mid);color:#b7791f}
.wt-task.low{background:#eafaf1;border-left:3px solid var(--c-low);color:#276749}
.wt-task.none{background:#f0f0f0;border-left:3px solid #ccc;color:#444}
.wt-now-line{position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:3;pointer-events:none}
.wt-now-dot{position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}

/* 本周列表视图 */
.wk-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.wk-nav-btn{border:1px solid var(--border);background:var(--bg);border-radius:6px;padding:4px 12px;font-size:12px;font-family:var(--font);cursor:pointer;color:var(--text);transition:background .1s}
.wk-nav-btn:hover{background:var(--hover)}
.wk-nav-range{font-size:13px;font-weight:600;color:var(--text)}
.wk-days-wrap{display:flex;flex-direction:column;gap:12px;padding-bottom:40px}
.wk-day-block{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.wk-day-block.today{border-color:var(--text)}
.wk-day-hd{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--hover)}
.wk-day-block.today .wk-day-hd{background:var(--text)}
.wk-day-block.today .wk-day-hd *{color:#fff !important}
.wk-day-name{font-size:13px;font-weight:700;color:var(--text)}
.wk-day-name.past{color:var(--t3)}
.wk-day-name.today{color:var(--text)}
.wk-day-date{font-size:11px;color:var(--t3)}
.wk-day-cnt{font-size:11px;color:var(--t3);margin-left:auto}
.wk-day-empty{padding:8px 14px;font-size:12px;color:var(--t3)}
.wk-task-row{display:flex;align-items:center;gap:8px;padding:7px 14px;border-top:1px solid var(--border);cursor:pointer;transition:background .1s}
.wk-task-row:hover{background:var(--hover)}
.wk-task-row.done .wk-task-title{text-decoration:line-through;color:var(--t3)}
.wk-task-check{width:14px;height:14px;border:1.5px solid #ccc;border-radius:50%;cursor:pointer;flex-shrink:0;position:relative;transition:all .15s}
.wk-task-check.checked{background:#333;border-color:#333}
.wk-task-check.checked:after{content:'';position:absolute;left:3px;top:0px;width:5px;height:9px;border:2px solid #fff;border-top:none;border-left:none;transform:rotate(45deg)}
.wk-task-title{flex:1;font-size:13px;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-task-time{font-size:11px;color:var(--t3);flex-shrink:0;white-space:nowrap}

.goals-section{border-top:1px solid var(--border);margin-top:8px;padding:8px 0 4px}
.goals-header{display:flex;align-items:center;justify-content:space-between;padding:2px 14px 6px;cursor:pointer}
.goals-header-label{font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--t3);text-transform:uppercase;display:flex;align-items:center;gap:5px;user-select:none}
.goals-toggle{font-size:10px;color:var(--t3);transition:transform .2s}
.goals-toggle.open{transform:rotate(90deg)}
.goals-body{padding:0 10px;overflow:hidden;max-height:0;transition:max-height .25s ease}
.goals-body.open{max-height:600px}
.goal-item{display:flex;align-items:flex-start;gap:6px;padding:4px 4px;border-radius:5px;cursor:default;transition:background .1s;group:true}
.goal-item:hover{background:var(--sb-hover)}
.goal-item:hover .goal-del{opacity:1}
.goal-check{width:14px;height:14px;border:1.5px solid var(--border);border-radius:3px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:2px;transition:all .1s}
.goal-check:hover{border-color:var(--t2)}
.goal-check.checked{background:var(--text);border-color:var(--text)}
.goal-check.checked::after{content:'';display:block;width:7px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translate(0px,-1px)}
.goal-text{font-size:12.5px;color:var(--text);flex:1;line-height:1.4;word-break:break-word;cursor:text;outline:none;min-width:0}
.goal-text.done{text-decoration:line-through;color:var(--t3)}
.goal-del{width:16px;height:16px;flex-shrink:0;background:none;border:none;color:var(--t3);cursor:pointer;opacity:0;display:flex;align-items:center;justify-content:center;padding:0;border-radius:3px;transition:all .1s;font-size:12px}
.goal-del:hover{color:#e03e2d;background:rgba(224,62,45,.08)}
.goal-add-row{display:flex;align-items:center;gap:6px;padding:4px 4px;margin-top:2px}
.goal-add-input{flex:1;border:none;outline:none;background:transparent;font-family:var(--font);font-size:12.5px;color:var(--text);padding:0}
.goal-add-input::placeholder{color:var(--t3)}
.goal-add-btn{width:18px;height:18px;border-radius:4px;border:1.5px dashed var(--border);background:none;color:var(--t3);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .1s;line-height:1}
.goal-add-btn:hover{border-color:var(--t2);color:var(--t2)}

.task-item.drag-over{border-top:2px solid var(--accent);margin-top:-1px}
.task-item[draggable="true"]{cursor:grab}
.task-item[draggable="true"]:active{cursor:grabbing}

/* ── 目标视图独立页面 ── */
.view-title{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.view-meta{font-size:13px;color:var(--t3);margin-bottom:3px}
.motto{font-size:13px;color:var(--t2);margin-top:5px;margin-bottom:16px;font-style:italic;opacity:.8;line-height:1.5}
/* ── 目标视图 ── */
.goals-view{padding:0 0 40px}
.goals-yr-hd{font-size:13px;font-weight:700;color:var(--text);margin:24px 0 12px;display:flex;align-items:center;gap:8px}
.goals-yr-hd svg{opacity:.5}
.goals-month-block{margin-bottom:20px;background:var(--bg);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.goals-month-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;user-select:none;transition:background .1s}
.goals-month-hd:hover{background:var(--sb-hover)}
.goals-month-title{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px}
.goals-month-prog{font-size:11px;color:var(--t3);display:flex;align-items:center;gap:8px}
.goals-prog-bar{width:60px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.goals-prog-fill{height:100%;background:var(--text);border-radius:2px;transition:width .3s}
.goals-month-body{border-top:1px solid var(--border);display:none}
.goals-month-body.open{display:block}
.goal-row{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);transition:background .1s}
.goal-row:last-child{border-bottom:none}
.goal-row:hover{background:var(--sb-hover)}
.goal-row:hover .gr-del{opacity:1}
.gr-check{width:16px;height:16px;border:1.5px solid var(--border);border-radius:4px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .15s}
.gr-check:hover{border-color:var(--t2)}
.gr-check.checked{background:var(--text);border-color:var(--text)}
.gr-check.checked::after{content:'';display:block;width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(0,-1px)}
.gr-text{flex:1;font-size:13px;color:var(--text);line-height:1.5;outline:none;cursor:text;word-break:break-word}
.gr-text.done{text-decoration:line-through;color:var(--t3)}
.gr-del{width:18px;height:18px;background:none;border:none;color:var(--t3);cursor:pointer;opacity:0;display:flex;align-items:center;justify-content:center;border-radius:3px;padding:0;transition:all .1s;font-size:13px;flex-shrink:0}
.gr-del:hover{color:#e03e2d}
.goal-add-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--border)}
.goal-cat-hd{font-size:12px;font-weight:700;color:var(--text);padding:10px 16px 4px;letter-spacing:.03em;text-transform:uppercase}
.goal-cat-sel{border:1px solid var(--border);border-radius:5px;padding:5px 8px;font-size:12px;font-family:var(--font);color:var(--text);background:var(--bg);cursor:pointer;outline:none;flex-shrink:0}
.goal-add-inp{flex:1;border:none;outline:none;background:transparent;font-family:var(--font);font-size:13px;color:var(--text)}
.goal-add-inp::placeholder{color:var(--t3)}
.goal-add-sub{padding:4px 10px;background:var(--text);color:#fff;border:none;border-radius:5px;font-size:12px;font-family:var(--font);cursor:pointer;font-weight:500}
.goals-new-month{display:flex;align-items:center;gap:8px;padding:4px 0;margin-top:4px}
.goals-new-month select{border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-family:var(--font);font-size:12.5px;color:var(--text);background:var(--bg);cursor:pointer;outline:none}
.goals-new-month button{padding:5px 12px;background:var(--text);color:#fff;border:none;border-radius:6px;font-family:var(--font);font-size:12.5px;cursor:pointer;font-weight:500}

.sb-stickies{border-top:1px solid var(--border);flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:8px 10px}
.sb-stickies-hd{font-size:10.5px;font-weight:600;color:var(--t3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px;flex-shrink:0}
#sb-sticky-pad{flex:1;border:none;outline:none;background:transparent;font-family:var(--font);font-size:12px;color:var(--text);line-height:1.6;width:100%;box-sizing:border-box;overflow-y:auto;word-break:break-word;white-space:pre-wrap}
#sb-sticky-pad:empty:before{content:attr(data-placeholder);color:var(--t3);pointer-events:none}
#sb-sticky-pad a{color:var(--accent);text-decoration:underline;cursor:pointer}
#sb-sticky-pad b,#sb-sticky-pad strong{font-weight:700}
/* 右键菜单 */
.sp-ctx-menu{position:fixed;background:var(--bg);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:4px 0;z-index:9999;min-width:130px;display:none}
.sp-ctx-menu.show{display:block}
.sp-ctx-item{padding:7px 14px;font-size:13px;font-family:var(--font);color:var(--text);cursor:pointer;white-space:nowrap}
.sp-ctx-item:hover{background:var(--hover)}
.sp-ctx-sep{height:1px;background:var(--border);margin:3px 0}

/* 目标双列布局 - Notion 风格 */
.goals-nav{display:flex;align-items:center;gap:16px;margin:0 0 24px}
.goals-nav-btn{background:none;border:1px solid var(--border);border-radius:5px;padding:3px 10px;cursor:pointer;font-size:14px;color:var(--t2);transition:background .1s}
.goals-nav-btn:hover{background:var(--hover)}
.goals-nav-label{font-size:14px;font-weight:600;color:var(--text);min-width:80px;text-align:center}
.goals-ng-wrap{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding:0 0 60px}
.goals-ng-col{display:flex;flex-direction:column;gap:0;border-radius:10px;padding:16px 18px;transition:background .2s}
.goals-ng-col-hd{display:flex;align-items:center;gap:10px;margin-bottom:6px;position:relative}
.goals-col-bg-btn{background:none;border:none;cursor:pointer;width:16px;height:16px;border-radius:50%;border:1.5px solid #ddd;margin-left:6px;flex-shrink:0;transition:transform .1s}
.goals-col-bg-btn:hover{transform:scale(1.2)}
.goals-col-bg-picker{position:absolute;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:10px;z-index:200;display:none;flex-wrap:wrap;gap:6px;width:172px;top:24px;left:0}
.goals-col-bg-picker.show{display:flex}
.gcbp-swatch{width:24px;height:24px;border-radius:5px;cursor:pointer;border:1.5px solid transparent;transition:transform .1s}
.gcbp-swatch:hover{transform:scale(1.15)}
.gcbp-swatch.active{border-color:#333}
.gcbp-clear{width:100%;font-size:11px;color:var(--t3);background:none;border:none;cursor:pointer;text-align:left;padding:2px 0;margin-top:2px}
.goals-ng-col-title{font-size:15px;font-weight:700;color:var(--text)}
.goals-ng-col-stat{font-size:12px;color:var(--t3)}
.goals-ng-prog-bar{height:3px;background:var(--border);border-radius:2px;margin-bottom:20px;overflow:hidden}
.goals-ng-prog-fill{height:100%;background:var(--text);border-radius:2px;transition:width .3s}
.goals-ng-cat{margin-bottom:20px}
.goals-ng-cat-hd{display:flex;align-items:center;gap:6px;padding:0 0 6px;border-bottom:1px solid var(--border);margin-bottom:2px}
.goals-ng-cat-name{font-size:13px;font-weight:700;color:var(--text);flex:1;outline:none;cursor:text}
.goals-ng-cat-stat{font-size:11px;color:var(--t3);flex-shrink:0}
.goals-ng-cat-del{background:none;border:none;cursor:pointer;color:var(--t3);padding:2px;display:none;line-height:1}
.goals-ng-cat-hd:hover .goals-ng-cat-del{display:inline-flex}
.goals-ng-col-desc{width:100%;box-sizing:border-box;border:none;border-bottom:1px dashed var(--border);outline:none;resize:none;font-family:var(--font);font-size:12.5px;color:var(--t2);background:transparent;line-height:1.6;padding:6px 0 8px;min-height:22px;overflow:hidden;margin-bottom:14px}
.goals-ng-col-desc::placeholder{color:var(--t3)}
.goals-ng-col-desc:focus{border-bottom-color:var(--accent)}
.goals-ng-item{display:flex;align-items:center;gap:8px;padding:5px 0 5px 4px;border-radius:4px;transition:background .1s}
.goals-ng-item:hover{background:var(--hover)}
.goals-ng-item.done .goals-ng-text{text-decoration:line-through;color:var(--t3)}
.goals-ng-check{width:14px;height:14px;border:1.5px solid #ccc;border-radius:3px;cursor:pointer;flex-shrink:0;position:relative;transition:all .15s}
.goals-ng-check.checked{background:#333;border-color:#333}
.goals-ng-check.checked:after{content:'';position:absolute;left:3px;top:0px;width:5px;height:9px;border:2px solid #fff;border-top:none;border-left:none;transform:rotate(45deg)}
.goals-ng-text{flex:1;font-size:13px;color:var(--text);outline:none;min-width:0;word-break:break-word;line-height:1.5}
.goals-ng-del{background:none;border:none;cursor:pointer;color:var(--t3);padding:2px;display:none;line-height:1}
.goals-ng-item:hover .goals-ng-del{display:inline-flex}
.goals-ng-item.warned{background:#fffbeb}
.goals-ng-item.warned .goals-ng-text{color:#92400e}
.goals-ng-warn{background:none;border:none;cursor:pointer;color:var(--t3);padding:2px;display:none;line-height:1;flex-shrink:0}
.goals-ng-warn.active{display:inline-flex !important}
.goals-ng-item:hover .goals-ng-warn{display:inline-flex}
.goals-ng-add-row{padding:0 0 0 22px;max-height:0;overflow:hidden;transition:max-height .15s}
.goals-ng-add-row.open{max-height:36px;padding:4px 0 4px 22px}
.goals-ng-cat-add-btn{background:none;border:none;cursor:pointer;color:var(--t3);font-size:16px;line-height:1;padding:0 4px;transition:color .1s;font-weight:300}
.goals-ng-cat-add-btn:hover{color:var(--text)}
.goals-ng-add-inp{width:100%;border:none;outline:none;font-size:12.5px;font-family:var(--font);color:var(--t2);background:transparent}
.goals-ng-add-inp::placeholder{color:var(--t3)}
.goals-ng-new-cat{padding:6px 0 0}
.goals-ng-new-cat-inp{width:100%;border:none;outline:none;font-size:12.5px;font-family:var(--font);color:var(--t2);background:transparent;padding:4px 0}
.goals-ng-new-cat-inp::placeholder{color:var(--t3)}
</style>
</head>
<body>

<!-- SIDEBAR -->
<nav class="sidebar">
  <div class="ws" style="cursor:default">
    <div class="ws-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
    <span id="app-name" ondblclick="editAppName()" title="双击编辑名称" style="cursor:text;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">我的清单</span>
    <input id="app-name-input" onblur="saveAppName()" onkeydown="if(event.key==='Enter')saveAppName();if(event.key==='Escape')cancelAppName()" style="display:none;flex:1;border:none;outline:none;background:transparent;font-family:var(--font);font-size:14px;font-weight:700;color:var(--text);min-width:0"/>
  </div>
  <div class="sb-sec">智能清单</div>
  <div id="sb-smart-list"></div>
  <div class="sb-sec" style="margin-top:8px;display:flex;align-items:center;justify-content:space-between;padding-right:14px">
    <span id="my-lists-label" ondblclick="editListsLabel()" title="双击编辑" style="cursor:text">我的清单</span>
    <input id="my-lists-input" onblur="saveListsLabel()" onkeydown="if(event.key==='Enter')saveListsLabel();if(event.key==='Escape')cancelListsLabel()" style="display:none;border:none;outline:none;background:transparent;font-family:var(--font);font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--t3);text-transform:uppercase;width:80px"/>
    <button onclick="showListModal(null)" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:16px;line-height:1;padding:0 2px;transition:color .1s" title="新建清单" onmouseenter="this.style.color='var(--text)'" onmouseleave="this.style.color='var(--t3)'">+</button>
  </div>
  <div class="sb-lists" id="sb-lists"></div>

  <!-- ── 便签区 ── -->
  <div class="sb-stickies" id="sb-stickies-area">
    <div class="sb-stickies-hd">便签</div>
    <div id="sb-sticky-pad" contenteditable="true" spellcheck="false" data-placeholder="记录常用链接、要点…" oninput="saveStickyPad()" oncontextmenu="onStickyPadCtx(event)" onmousedown="handleCtxLinkClick(event)"></div>
    <!-- 右键菜单 -->
    <div class="sp-ctx-menu" id="sp-ctx-menu">
      <div class="sp-ctx-item" onclick="spCtxBold()"><b>B</b> 加粗</div>
      <div class="sp-ctx-item" onclick="spCtxLink()">🔗 添加链接</div>
      <div class="sp-ctx-sep"></div>
      <div class="sp-ctx-item" onclick="spCtxRemoveLink()">取消链接</div>
      <div class="sp-ctx-item" onclick="spCtxClear()">清除格式</div>
    </div>
  </div>
</nav>

<!-- MAIN -->
<main class="main" id="main-area">

  <!-- ── 任务视图 ── -->
  <div id="task-view">
    <div class="header" id="main-header">
      <h1 id="view-title">今天</h1>
      <div class="meta" id="view-meta"></div>
      <div class="motto" id="motto" title="双击自定义，右键恢复每日自动" ondblclick="editMotto()" oncontextmenu="resetMotto(event)" style="cursor:text"></div>

      <button class="header-bg-btn" onclick="toggleHeaderBgPanel(event)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        换背景
      </button>
      <div class="header-bg-panel" id="header-bg-panel">
        <div class="hbp-label">预设颜色</div>
        <div class="hbp-colors" id="hbp-color-list"></div>
        <div class="hbp-label">背景图片</div>
        <div class="hbp-upload-row">
          <label class="hbp-upload-btn">
            📁 选择图片
            <input type="file" accept="image/*" style="display:none" onchange="onHeaderBgUpload(this)"/>
          </label>
          <button class="hbp-clear" onclick="clearHeaderBg()">清除</button>
        </div>
      </div>
    </div>

    <div class="add-wrap">
      <div class="add-bar">
        <div class="add-plus">+</div>
        <input type="text" class="add-task-input" id="task-input" placeholder="添加任务… (可拖入链接)" onkeydown="if(event.key==='Enter')addTask()" ondragover="event.preventDefault()" ondrop="onDropLink(event,'task-input')" onpaste="onPasteAutoLink(event,'task-input')"/>
        <div class="add-sep"></div>
        <!-- 优先级 -->
        <div class="prio-wrapper" id="prio-wrapper">
          <div class="prio-trigger" id="prio-trigger" onclick="togglePrio()">
            <div class="prio-dot" id="prio-dot" style="background:#ccc"></div>
            <span id="prio-label">优先级</span>
          </div>
          <div class="prio-dropdown" id="prio-dropdown">
            <div class="prio-opt" data-val="high" onclick="selectPrio('high',this)">
              <div class="prio-dot" style="background:#e03e2d"></div>紧急
            </div>
            <div class="prio-opt" data-val="mid" onclick="selectPrio('mid',this)">
              <div class="prio-dot" style="background:#d97706"></div>重要
            </div>
            <div class="prio-opt" data-val="low" onclick="selectPrio('low',this)">
              <div class="prio-dot" style="background:#16a34a"></div>普通
            </div>
            <div class="prio-opt selected" data-val="none" onclick="selectPrio('none',this)">
              <div class="prio-dot" style="background:#ccc"></div>常态
            </div>
          </div>
        </div>
        <div class="add-sep"></div>

        <!-- 日期时间 -->
        <div class="dt-wrapper" id="dt-wrapper">
          <div class="dt-trigger" id="dt-trigger" onclick="toggleDT()">
            <span class="dt-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
            <span class="dt-label" id="dt-label"></span>
          </div>
          <div class="dt-popup" id="dt-popup">
            <div style="display:flex;gap:12px">
              <div style="flex:1">
                <label>开始</label>
                <input type="date" id="dt-date-input" onchange="onDTDateChange()"/>
                <div style="display:flex;gap:0;margin-bottom:2px">
                  <div style="flex:1;text-align:center;font-size:11px;color:var(--t3);font-weight:500">时</div>
                  <div style="flex:1;text-align:center;font-size:11px;color:var(--t3);font-weight:500">分</div>
                </div>
                <div class="time-scroller">
                  <div class="time-col" id="hour-col"></div>
                  <div class="time-col" id="min-col"></div>
                </div>
              </div>
              <div style="flex:1">
                <label>结束</label>
                <input type="date" id="dt-end-date-input" onchange="onDTEndDateChange()"/>
                <div style="display:flex;gap:0;margin-bottom:2px">
                  <div style="flex:1;text-align:center;font-size:11px;color:var(--t3);font-weight:500">时</div>
                  <div style="flex:1;text-align:center;font-size:11px;color:var(--t3);font-weight:500">分</div>
                </div>
                <div class="time-scroller">
                  <div class="time-col" id="end-hour-col"></div>
                  <div class="time-col" id="end-min-col"></div>
                </div>
              </div>
            </div>
            <div class="dt-actions">
              <button class="dt-clear" onclick="clearDT()">清除</button>
              <button class="dt-ok" onclick="confirmDT()">确定</button>
            </div>
          </div>
        </div>
        <div class="add-sep"></div>

        <!-- 清单 -->
        <div class="list-sel-wrap" id="list-sel-wrap">
          <div class="list-sel-trigger" id="list-sel-trigger" onclick="toggleListSel()">
            <span class="ls-icon" id="ls-icon"></span>
            <span class="ls-name" id="ls-name">默认</span>
          </div>
          <div class="list-sel-dd" id="list-sel-dd"></div>
        </div>
        <div class="add-sep"></div>

        <!-- 循环 -->
        <div class="repeat-wrap" id="repeat-wrap">
          <div class="repeat-trigger" id="repeat-trigger" onclick="toggleRepeat()">
            <span class="rpt-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 014-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg></span>
            <span class="rpt-label" id="rpt-label">不重复</span>
          </div>
          <div class="repeat-dd" id="repeat-dd">
            <div class="repeat-opt selected" data-val="none" onclick="selectRepeat('none',this)">不重复</div>
            <div class="repeat-opt" data-val="daily" onclick="selectRepeat('daily',this)">每天</div>
            <div class="repeat-opt" data-val="weekday" onclick="selectRepeat('weekday',this)">每个工作日</div>
            <div class="repeat-opt" data-val="weekly" onclick="selectRepeat('weekly',this)">每周</div>
            <div class="repeat-opt" data-val="monthly" onclick="selectRepeat('monthly',this)">每月</div>
            <div class="repeat-opt" data-val="yearly" onclick="selectRepeat('yearly',this)">每年</div>
            <div class="repeat-opt" data-val="custom" onclick="selectRepeat('custom',this)">自定义间隔…</div>
          </div>
          <div class="custom-repeat-panel" id="custom-repeat-panel">
            <div class="crp-row">
              <span class="crp-label-inline">每</span>
              <input type="number" id="crp-n-input" min="1" max="99" value="1" class="crp-n-input"/>
              <select id="crp-unit-sel" class="crp-unit-sel" onchange="crpUnitChange()">
                <option value="day">天</option>
                <option value="week">周</option>
                <option value="month">月</option>
              </select>
            </div>
            <div id="crp-week-days" style="display:none">
              <div class="crp-label" style="margin-top:8px">重复星期</div>
              <div class="crp-week-row">
                <div class="crp-wd active" data-wd="1" onclick="crpToggleWd(this)">一</div>
                <div class="crp-wd" data-wd="2" onclick="crpToggleWd(this)">二</div>
                <div class="crp-wd" data-wd="3" onclick="crpToggleWd(this)">三</div>
                <div class="crp-wd" data-wd="4" onclick="crpToggleWd(this)">四</div>
                <div class="crp-wd" data-wd="5" onclick="crpToggleWd(this)">五</div>
                <div class="crp-wd" data-wd="6" onclick="crpToggleWd(this)">六</div>
                <div class="crp-wd" data-wd="0" onclick="crpToggleWd(this)">日</div>
              </div>
            </div>
            <div class="crp-row" style="margin-top:8px">
              <span class="crp-label-inline">截止</span>
              <input type="date" id="crp-end-date" class="crp-end-date" placeholder="无截止日"/>
            </div>
            <div class="crp-actions">
              <button style="background:var(--sb-hover);color:var(--t2)" onclick="cancelCustomRepeat()">取消</button>
              <button style="background:var(--text);color:#fff" onclick="confirmCustomRepeat()">确定</button>
            </div>
          </div>
        </div>

        <button class="add-btn" onclick="addTask()">添加</button>
      </div>
    </div>

    <div class="filters" id="filter-bar">
      <button class="chip active" data-f="active" onclick="setFilter('active',this)">待完成</button>
      <button class="chip" data-f="all" onclick="setFilter('all',this)">全部</button>
      <button class="chip" data-f="high" onclick="setFilter('high',this)">紧急优先</button>
      <button class="chip" data-f="overdue" onclick="setFilter('overdue',this)">已逾期</button>
      <button class="chip" data-f="done" onclick="setFilter('done',this)">已完成</button>
    </div>
    <div class="divider"></div>
    <div class="task-list" id="task-list"></div>
  </div>

  <!-- ── Notes 列表 ── -->
  <div id="notes-view">
    <div class="header">
      <h1>Notes</h1>
      <div class="meta" id="notes-meta"></div>
    </div>
    <div class="notes-wrap" id="notes-list"></div>
  </div>

  <!-- ── 目标视图 ── -->
  <div id="goals-view-panel" style="display:none;flex:1;overflow-y:auto;padding:28px 44px 40px;flex-direction:column">
  </div>

  <!-- ── 笔记编辑 ── -->
  <div id="note-editor-view">
    <div class="header" style="padding-bottom:8px;flex-shrink:0">
      <div class="note-toolbar-top">
        <button class="note-back" onclick="backToNotes()">← 返回</button>
        <button class="note-save" onclick="saveNote()">保存</button>
        <button class="btn-danger" style="padding:6px 14px;border-radius:6px;border:none;font-size:13px;font-weight:500;cursor:pointer;background:var(--high-bg);color:var(--high)" onclick="deleteNote()">删除</button>
      </div>
      <!-- 富文本工具栏 -->
      <div class="note-rtb">
        <button class="rtb-btn" onclick="rtCmd('bold')" title="加粗"><b>B</b></button>
        <button class="rtb-btn" onclick="rtCmd('italic')" title="斜体"><i>I</i></button>
        <button class="rtb-btn" onclick="rtCmd('underline')" title="下划线"><u>U</u></button>
        <button class="rtb-btn" onclick="rtCmd('strikeThrough')" title="删除线"><s>S</s></button>
        <div class="rtb-sep"></div>
        <button class="rtb-btn" onclick="rtCmd('insertUnorderedList')" title="无序列表">≡</button>
        <button class="rtb-btn" onclick="rtCmd('insertOrderedList')" title="有序列表">1.</button>
        <div class="rtb-sep"></div>
        <button class="rtb-btn" onclick="rtHeading(1)" title="H1">H1</button>
        <button class="rtb-btn" onclick="rtHeading(2)" title="H2">H2</button>
        <button class="rtb-btn" onclick="rtHeading(3)" title="H3">H3</button>
        <div class="rtb-sep"></div>
        <button class="rtb-btn" onclick="rtLink()" title="插入链接">🔗</button>
        <button class="rtb-btn" onclick="rtCmd('removeFormat')" title="清除格式">T̲</button>
      </div>
    </div>
    <div class="note-editor">
      <input type="text" id="note-title-input" placeholder="标题"/>
      <div id="note-body-editor" class="note-body-editor" contenteditable="true" spellcheck="false" data-placeholder="在这里记录笔记、想法…"></div>
    </div>
  </div>

</main>

<!-- ── Modal: 新建/编辑清单 ── -->
<div class="overlay" id="list-modal" style="display:none">
  <div class="modal">
    <h2 id="list-modal-title">新建清单</h2>
    <label>清单名称</label>
    <input type="text" id="list-name-input" placeholder="例如：读书计划" onkeydown="if(event.key==='Enter')confirmList()"/>
    <label>选择图标</label>
    <div class="icon-grid" id="icon-grid"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="hideListModal()">取消</button>
      <button class="btn-danger" id="list-delete-btn" style="display:none" onclick="deleteList()">删除清单</button>
      <button class="btn-confirm" onclick="confirmList()">保存</button>
    </div>
  </div>
</div>

<!-- ── Modal: 编辑任务 ── -->
<div class="overlay" id="edit-modal" style="display:none">
  <div class="modal edit-modal">
    <h2>编辑任务</h2>
    <label>任务名称</label>
    <input type="text" id="edit-title" placeholder="任务名称" onkeydown="if(event.key==='Enter')saveEdit()"/>
    <label>所属清单</label>
    <select id="edit-list" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-sm);font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);cursor:pointer;outline:none"></select>
    <label>内容备注</label>
    <textarea id="edit-body" placeholder="详细描述、备注… (可拖入链接)" ondragover="event.preventDefault()" ondrop="onDropLink(event,'edit-body')" onpaste="onPasteAutoLink(event,'edit-body')"></textarea>
    <div class="edit-row">
      <div>
        <label>优先级</label>
        <select id="edit-prio">
          <option value="none">常态</option>
          <option value="low">普通</option>
          <option value="mid">重要</option>
          <option value="high">紧急</option>
        </select>
      </div>
      <div>
        <label>循环</label>
        <div style="position:relative">
          <select id="edit-repeat" onchange="onEditRepeatChange(this)">
            <option value="none">不重复</option>
            <option value="daily">每天</option>
            <option value="weekday">每个工作日</option>
            <option value="weekly">每周</option>
            <option value="monthly">每月</option>
            <option value="yearly">每年</option>
            <option value="custom">自定义…</option>
          </select>
          <div id="edit-custom-repeat-display" style="display:none;margin-top:4px;font-size:12px;color:var(--accent);cursor:pointer" onclick="openEditCustomRepeat()"></div>
          <div class="custom-repeat-panel" id="edit-custom-repeat-panel">
            <div class="crp-row">
              <span class="crp-label-inline">每</span>
              <input type="number" id="ecrp-n-input" min="1" max="99" value="1" class="crp-n-input"/>
              <select id="ecrp-unit-sel" class="crp-unit-sel" onchange="ecrpUnitChange()">
                <option value="day">天</option>
                <option value="week">周</option>
                <option value="month">月</option>
              </select>
            </div>
            <div id="ecrp-week-days" style="display:none">
              <div class="crp-label" style="margin-top:8px">重复星期</div>
              <div class="crp-week-row">
                <div class="crp-wd active" data-ewd="1" onclick="ecrpToggleWd(this)">一</div>
                <div class="crp-wd" data-ewd="2" onclick="ecrpToggleWd(this)">二</div>
                <div class="crp-wd" data-ewd="3" onclick="ecrpToggleWd(this)">三</div>
                <div class="crp-wd" data-ewd="4" onclick="ecrpToggleWd(this)">四</div>
                <div class="crp-wd" data-ewd="5" onclick="ecrpToggleWd(this)">五</div>
                <div class="crp-wd" data-ewd="6" onclick="ecrpToggleWd(this)">六</div>
                <div class="crp-wd" data-ewd="0" onclick="ecrpToggleWd(this)">日</div>
              </div>
            </div>
            <div class="crp-row" style="margin-top:8px">
              <span class="crp-label-inline">截止</span>
              <input type="date" id="ecrp-end-date" class="crp-end-date"/>
            </div>
            <div class="crp-actions">
              <button style="background:var(--sb-hover);color:var(--t2)" onclick="cancelEditCustomRepeat()">取消</button>
              <button style="background:var(--text);color:#fff" onclick="confirmEditCustomRepeat()">确定</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <label>日期时间</label>
    <!-- 开始时间 -->
    <div style="display:flex;gap:8px;align-items:flex-start">
      <div style="flex:1">
        <div style="font-size:11px;color:var(--t3);margin-bottom:4px">开始</div>
        <input type="date" id="edit-dt-date" style="width:100%;border:1.5px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;font-family:var(--font);outline:none;color:var(--text);box-sizing:border-box" onchange="editSyncEndDate()"/>
        <div style="display:flex;margin-top:6px">
          <div style="flex:1;text-align:center;font-size:11px;color:var(--t3);font-weight:500">时</div>
          <div style="flex:1;text-align:center;font-size:11px;color:var(--t3);font-weight:500">分</div>
        </div>
        <div class="time-scroller" style="height:96px">
          <div class="time-col" id="edit-hour-col"></div>
          <div class="time-col" id="edit-min-col"></div>
        </div>
      </div>
      <div style="flex:1">
        <div style="font-size:11px;color:var(--t3);margin-bottom:4px">结束</div>
        <input type="date" id="edit-dt-end-date" style="width:100%;border:1.5px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;font-family:var(--font);outline:none;color:var(--text);box-sizing:border-box"/>
        <div style="display:flex;margin-top:6px">
          <div style="flex:1;text-align:center;font-size:11px;color:var(--t3);font-weight:500">时</div>
          <div style="flex:1;text-align:center;font-size:11px;color:var(--t3);font-weight:500">分</div>
        </div>
        <div class="time-scroller" style="height:96px">
          <div class="time-col" id="edit-ehour-col"></div>
          <div class="time-col" id="edit-emin-col"></div>
        </div>
      </div>
    </div>
    <!-- 隐藏字段供 saveEdit 读取 -->
    <input type="hidden" id="edit-dt"/>
    <input type="hidden" id="edit-dt-end"/>
    <div class="modal-actions" style="margin-top:6px">
      <button class="btn-cancel" onclick="hideEditModal()">取消</button>
      <button class="btn-confirm" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════
// DATA

function renderGoals() {
  const body = document.getElementById('goals-body');
  const toggle = document.getElementById('goals-toggle');
  if (!body || !toggle) return;
  if(goalsOpen) { body.classList.add('open'); toggle.classList.add('open'); }
  else { body.classList.remove('open'); toggle.classList.remove('open'); }
  // 排序：未完成在前，已完成在后
  const sorted = [...goals].sort((a,b) => (a.done?1:0)-(b.done?1:0));
  document.getElementById('goals-list').innerHTML = sorted.map(g =>
    `<div class="goal-item" data-id="${g.id}">
      <div class="goal-check ${g.done?'checked':''}" onclick="toggleGoal('${g.id}')"></div>
      <div class="goal-text ${g.done?'done':''}" contenteditable="true" onblur="saveGoalText('${g.id}',this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${escHtml(g.text)}</div>
      <button class="goal-del" onclick="deleteGoal('${g.id}')" title="删除">×</button>
    </div>`
  ).join('');
}
function toggleGoals() {
  goalsOpen = !goalsOpen;
  localStorage.setItem('td_goals_open', goalsOpen);
  renderGoals();
}
function addGoal() {
  const inp = document.getElementById('goal-add-input');
  const text = inp.value.trim();
  if(!text) return;
  goals.push({ id: Date.now().toString(), text, done: false });
  inp.value = '';
  saveGoals();
  renderGoals();
}
function focusGoalInput() {
  if(!goalsOpen) { goalsOpen = true; localStorage.setItem('td_goals_open','true'); renderGoals(); }
  setTimeout(()=>document.getElementById('goal-add-input').focus(), 50);
}
function toggleGoal(id) {
  const g = goals.find(g=>g.id===id);
  if(g) { g.done = !g.done; saveGoals(); renderGoals(); }
}
function saveGoalText(id, el) {
  const g = goals.find(g=>g.id===id);
  if(g) { g.text = el.innerText.trim() || g.text; saveGoals(); }
}
function deleteGoal(id) {
  goals = goals.filter(g=>g.id!==id);
  saveGoals();
  renderGoals();
}

function renderGoalsView() {

  const monthLabel = `${yr} 年 ${mo} 月`;

  // 月份导航
  html += `<div class="goals-nav">
    <button class="goals-nav-btn" onclick="changeGoalsMonth(-1)">&#8592;</button>
    <span class="goals-nav-label">${monthLabel}</span>
    <button class="goals-nav-btn" onclick="changeGoalsMonth(1)">&#8594;</button>
  </div>`;

  // 双列
  html += `<div class="goals-ng-wrap">`;
  ['team','personal'].forEach(col => {
    const colLabel = col==='team' ? '团队目标' : '个人目标';
    const cats = data[col] || {};
    const allItems = Object.entries(cats).filter(([k])=>k!=='__desc__'&&k!=='__col_desc__').map(([,v])=>v).flat();
    const total = allItems.length;
    const done = allItems.filter(x=>x.done).length;
    const pct = total ? Math.round(done/total*100) : 0;

    const bgVal = goalsColBg[col] || 'transparent';
    html += `<div class="goals-ng-col" id="goals-col-${col}" style="background:${bgVal}">`;
    // 列标题 + 进度
    html += `<div class="goals-ng-col-hd">
      <span class="goals-ng-col-title">${colLabel}</span>
      <span style="flex:1"></span>
      <span class="goals-ng-col-stat">${done}/${total}</span>
      <button class="goals-col-bg-btn" style="background:${bgVal==='transparent'?'#eee':bgVal}"
        onclick="toggleColBgPicker(event,'${col}')" title="设置背景色"></button>
    </div>`;
    html += `<div class="goals-col-bg-picker" id="gcbp-${col}">
      ${['transparent','#fef9ef','#fff8f0','#f0f7ff','#f0fff4','#fdf0ff','#fff0f0','#f5f5f5','#fffbe6','#e8f5e9','#e3f2fd','#fce4ec'].map(c =>
        `<div class="gcbp-swatch ${goalsColBg[col]===c?'active':''}"

          onclick="setColBg('${col}','${c}')"></div>`
      ).join('')}

    </div>`;
    html += `<div class="goals-ng-prog-bar"><div class="goals-ng-prog-fill" style="width:${pct}%"></div></div>`;

    // 列总描述框
    const colDesc = (data[col].__col_desc__) || '';
    html += `<textarea class="goals-ng-col-desc" placeholder="写下${colLabel}的总目标或整体方向…"
      onblur="saveColDesc('${col}',this)"
      oninput="autoResizeCatDesc(this)"
    >${escHtml(colDesc)}</textarea>`;

    // 分类
    Object.keys(cats).filter(c => c !== '__desc__' && c !== '__col_desc__').forEach(cat => {
      const items = cats[cat] || [];
      const catDone = items.filter(x=>x.done).length;
      html += `<div class="goals-ng-cat">`;
      // 分类标题行
      const catId = col + '_' + escHtml(cat).replace(/[^a-zA-Z0-9]/g,'_');
      html += `<div class="goals-ng-cat-hd">
        <div class="goals-ng-cat-name" contenteditable="true"
          data-col="${col}" data-cat="${escHtml(cat)}"
          onblur="renameGoalCat(this,'${col}','${escHtml(cat)}')"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
        >${escHtml(cat)}</div>
        <span class="goals-ng-cat-stat">${catDone}/${items.length}</span>
        <button class="goals-ng-cat-add-btn" onclick="openGoalAddRow('${catId}')" title="添加目标">+</button>
        <button class="goals-ng-cat-del" onclick="deleteGoalCat('${col}','${escHtml(cat)}')" title="删除分类">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>`;
      // 目标条目（已完成沉底）
      const sortedItems = [...items].sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0));
      sortedItems.forEach(g => {
        html += `<div class="goals-ng-item ${g.done?'done':''} ${g.warn?'warned':''}">
          <div class="goals-ng-check ${g.done?'checked':''}" onclick="toggleGoalNG('${col}','${escHtml(cat)}','${g.id}')"></div>
          <div class="goals-ng-text" contenteditable="true"
            onblur="saveGoalNGText('${col}','${escHtml(cat)}','${g.id}',this)"
            onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
          >${escHtml(g.text)}</div>
          <button class="goals-ng-warn ${g.warn?'active':''}" title="${g.warn?'取消预警':'设为预警（需尽快推进）'}"
            onclick="toggleGoalWarn('${col}','${escHtml(cat)}','${g.id}')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="${g.warn?'#f59e0b':'none'}" stroke="${g.warn?'#f59e0b':'currentColor'}" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>

          </button>

      // 添加目标输入
      html += `<div class="goals-ng-add-row" id="add-row-${catId}">

          onkeydown="if(event.key==='Enter')addGoalNG('${col}','${escHtml(cat)}',this);if(event.key==='Escape')closeGoalAddRow('${catId}',this)"
          onblur="setTimeout(()=>closeGoalAddRow('${catId}',null),150)"/>
      </div>`;
      html += `</div>`; // .goals-ng-cat
    });

    // 新建分类
    html += `<div class="goals-ng-new-cat">
      <input class="goals-ng-new-cat-inp" placeholder="+ 新建分类"
        onkeydown="if(event.key==='Enter')addGoalCat('${col}',this)"/>
    </div>`;

    html += `</div>`; // .goals-ng-col
  });
  html += `</div>`; // .goals-ng-wrap
  main.innerHTML = html;
}

function changeGoalsMonth(delta) {
  const [yr, mo] = goalsViewYM.split('-').map(Number);
  const fromYM = goalsViewYM; // 切换前的月份（来源月）
  const d = new Date(yr, mo - 1 + delta, 1);
  goalsViewYM = d.getFullYear() + '-' + ('' + (d.getMonth() + 1)).padStart(2, '0');
  // 新月份没有数据 → 从来源月复制分类结构
  if (!goalsNG[goalsViewYM]) {
    const srcData = goalsNG[fromYM];
    if (srcData) {
      goalsNG[goalsViewYM] = { team: {}, personal: {} };
      ['team', 'personal'].forEach(col => {
        const srcCol = srcData[col] || {};
        Object.keys(srcCol).forEach(cat => {
          if (cat === '__desc__') return;
          goalsNG[goalsViewYM][col][cat] = [];
        });
        // 复制分类总目标描述
        if (srcCol.__desc__) {
          goalsNG[goalsViewYM][col].__desc__ = Object.assign({}, srcCol.__desc__);
        }
        // 复制列总描述
        if (srcCol.__col_desc__) {
          goalsNG[goalsViewYM][col].__col_desc__ = srcCol.__col_desc__;
        }
      });
      saveGoalsNG();
    }
  }
  renderGoalsView();
}

function toggleColBgPicker(e, col) {
  e.stopPropagation();
  const picker = document.getElementById('gcbp-' + col);
  if (!picker) return;
  // 关闭其他
  document.querySelectorAll('.goals-col-bg-picker').forEach(p => { if (p !== picker) p.classList.remove('show'); });
  picker.classList.toggle('show');
}
function setColBg(col, val) {
  goalsColBg[col] = val;
  saveGoalsColBg();
  renderGoalsView();
}

document.addEventListener('click', () => {

  const data = getGoalsMonth(goalsViewYM);
  data[col].__col_desc__ = el.value.trim();
  saveGoalsNG();

function saveCatDesc(col, cat, el) {
  const data = getGoalsMonth(goalsViewYM);
  if (!data[col].__desc__) data[col].__desc__ = {};
  data[col].__desc__[cat] = el.value.trim();
  saveGoalsNG();
}
function autoResizeCatDesc(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}
function toggleGoalWarn(col, cat, id) {
  const data = getGoalsMonth(goalsViewYM);
  const arr = (data[col][cat] || []);
  const g = arr.find(x => x.id == id);
  if (g) { g.warn = !g.warn; saveGoalsNG(); renderGoalsView(); }
}

function addGoalCat(col, inputEl) {
  const name = inputEl.value.trim();
  if (!name) return;
  const data = getGoalsMonth(goalsViewYM);
  if (!data[col][name]) {
    data[col][name] = [];
    saveGoalsNG();
    renderGoalsView();
  }
  inputEl.value = '';
}

function renameGoalCat(el, col, oldName) {
  const newName = el.innerText.trim();
  if (!newName || newName === oldName) return;
  const data = getGoalsMonth(goalsViewYM);
  if (data[col][newName]) return; // 已存在
  data[col][newName] = data[col][oldName] || [];
  delete data[col][oldName];
  saveGoalsNG();
  renderGoalsView();
}

function deleteGoalCat(col, cat) {
  if (!confirm(`删除分类「${cat}」及其所有目标？`)) return;
  const data = getGoalsMonth(goalsViewYM);
  delete data[col][cat];
  saveGoalsNG();
  renderGoalsView();
}

function addGoalNG(col, cat, inputEl) {
  const text = inputEl.value.trim();
  if (!text) return;
  const data = getGoalsMonth(goalsViewYM);
  if (!data[col][cat]) data[col][cat] = [];
  data[col][cat].push({ id: String(Date.now() + Math.random()), text, done: false });
  saveGoalsNG();
  renderGoalsView();
}
function openGoalAddRow(catId) {
  const row = document.getElementById('add-row-' + catId);
  if (!row) return;
  row.classList.add('open');
  const inp = row.querySelector('input');
  if (inp) inp.focus();
}
function closeGoalAddRow(catId, inp) {
  const row = document.getElementById('add-row-' + catId);
  if (!row) return;
  const input = inp || row.querySelector('input');
  if (!input || !input.value.trim()) {
    row.classList.remove('open');
  }
}

function toggleGoalNG(col, cat, id) {
  const data = getGoalsMonth(goalsViewYM);
  const arr = (data[col][cat] || []);
  const g = arr.find(x => x.id == id);
  if (g) { g.done = !g.done; saveGoalsNG(); renderGoalsView(); }
}

function saveGoalNGText(col, cat, id, el) {
  const data = getGoalsMonth(goalsViewYM);
  const arr = (data[col][cat] || []);
  const g = arr.find(x => x.id == id);
  if (g) { g.text = el.innerText.trim() || g.text; saveGoalsNG(); }
}

function deleteGoalNG(col, cat, id) {
  const data = getGoalsMonth(goalsViewYM);
  if (!data[col][cat]) return;
  data[col][cat] = data[col][cat].filter(x => x.id != id);
  saveGoalsNG();
  renderGoalsView();
}

function renderGoalItemsWithCategory(items, ym) {
  // 按分类分组
  const cats = {};
  const noCat = [];
  items.forEach(g => {
    if (g.category) {
      if (!cats[g.category]) cats[g.category] = [];
      cats[g.category].push(g);
    } else {
      noCat.push(g);
    }
  });
  const sortItems = arr => arr.sort((a,b)=>(a.done?1:0)-(b.done?1:0));
  const renderRow = (g, ym) => `
    <div class="goal-row">
      <div class="gr-check ${g.done?'checked':''}" onclick="toggleGoalItem('${ym}','${g.id}')"></div>
      <div class="gr-text ${g.done?'done':''}" contenteditable="true"
        onblur="saveGoalItemText('${ym}','${g.id}',this)"
        onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${escHtml(g.text)}</div>
      <button class="gr-del" onclick="deleteGoalItem('${ym}','${g.id}')" title="删除">×</button>
    </div>`;

  let html = '';
  // 先渲染有分类的
  Object.keys(cats).sort().forEach(cat => {
    html += `<div class="goal-cat-hd">${escHtml(cat)}</div>`;
    html += sortItems(cats[cat]).map(g => renderRow(g, ym)).join('');
  });
  // 无分类的放最后（有分类内容时加小标题）
  if (Object.keys(cats).length > 0 && noCat.length > 0) {
    html += `<div class="goal-cat-hd" style="color:var(--t3)">其他</div>`;
  }
  html += sortItems(noCat).map(g => renderRow(g, ym)).join('');
  return html;
}

// ── 粘贴 URL 自动抓取标题 ──
async function fetchUrlTitle(url) {
  try {
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
    const res = await fetch(proxyUrl, {signal: AbortSignal.timeout(5000)});
    const data = await res.json();
    const html = data.contents || '';
    const m = html.match(/<title[^>]*>([^<]{1,200})<\/title>/i);
    return m ? m[1].trim().replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'") : null;
  } catch(e) { return null; }
}

async function onPasteAutoLink(e, targetId) {
  const text = e.clipboardData.getData('text/plain').trim();
  if (!text.startsWith('http')) return;
  const el = document.getElementById(targetId);
  if (!el) return;
  // 给个视觉提示
  const prevPlaceholder = el.placeholder;
  if (el.placeholder !== undefined) el.placeholder = '正在获取链接标题…';
  const title = await fetchUrlTitle(text);
  if (el.placeholder !== undefined) el.placeholder = prevPlaceholder;
  if (title && title !== text) {
    // 插入格式：[标题](url) 样式的纯文本，方便 linkify 渲染
    e.preventDefault();
    const insert = `${title} ${text}`;
    if (el.tagName === 'TEXTAREA') {
      const pos = el.selectionStart;
      el.value = el.value.slice(0, pos) + insert + el.value.slice(el.selectionEnd);
      el.selectionStart = el.selectionEnd = pos + insert.length;
    } else {
      el.value = (el.value ? el.value + ' ' : '') + insert;
    }
  }
  // 如果没有抓到标题，让默认粘贴行为正常发生
}

// ── 拖拽链接到输入框 ──
function onDropLink(e, targetId) {
  e.preventDefault();
  const url = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain') || '';
  if (!url || !url.startsWith('http')) return;
  const el = document.getElementById(targetId);
  if (!el) return;
  if (el.tagName === 'TEXTAREA') {
    const pos = el.selectionStart || el.value.length;
    el.value = el.value.slice(0, pos) + url + el.value.slice(pos);
  } else {
    el.value = (el.value ? el.value + ' ' : '') + url;
  }
  el.focus();
}

function editMotto() {
  const el = document.getElementById('motto');
  if (!el) return;
  const cur = el.textContent;
  el.setAttribute('contenteditable', 'true');
  el.focus();
  // 全选
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  function done() {
    el.removeAttribute('contenteditable');
    el.removeEventListener('blur', done);
    el.removeEventListener('keydown', onKey);
    const val = el.textContent.trim();
    if (val) {
      localStorage.setItem('td_motto_custom', val);
    }
  }
  function onKey(e) {
    if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    if (e.key === 'Escape') {
      el.textContent = cur;
      el.removeAttribute('contenteditable');
      el.removeEventListener('blur', done);
      el.removeEventListener('keydown', onKey);
    }
  }
  el.addEventListener('blur', done);
  el.addEventListener('keydown', onKey);
}
function resetMotto(e) {
  e.preventDefault();
  if (!confirm('恢复每日自动金句？')) return;
  localStorage.removeItem('td_motto_custom');
  const d = new Date();

function autoFillEditEndTime() {
  const sd = document.getElementById('edit-dt-date').value;
  const sh = document.querySelector('#edit-hour-col .selected')?.textContent || '';
  const sm = document.querySelector('#edit-min-col .selected')?.textContent || '';
  if (!sd || !sh || !sm) return;
  const d = new Date(`${sd}T${sh}:${sm}`);
  d.setMinutes(d.getMinutes()+30);
  const edate = p2(d.getFullYear())+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
  const eh = p2(d.getHours()), em = p2(d.getMinutes());
  // 找最近的5分档
  const emRound = EDIT_MINS.reduce((a,b)=>Math.abs(parseInt(b)-d.getMinutes())<Math.abs(parseInt(a)-d.getMinutes())?b:a);
  document.getElementById('edit-dt-end-date').value = edate;
  document.querySelectorAll('#edit-ehour-col .time-slot').forEach(e=>{
    e.classList.toggle('selected', e.textContent===eh);
  });
  document.querySelectorAll('#edit-emin-col .time-slot').forEach(e=>{
    e.classList.toggle('selected', e.textContent===emRound);
  });
  syncEditDTHidden();
}

function syncEditDTHidden() {
  const sd = document.getElementById('edit-dt-date').value;
  const sh = document.querySelector('#edit-hour-col .selected')?.textContent || '';
  const sm = document.querySelector('#edit-min-col .selected')?.textContent || '';

  const eh = document.querySelector('#edit-ehour-col .selected')?.textContent || '';

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
}
function nowHM() {
  const d = new Date();
  // 取整到5分钟
  const m = Math.round(d.getMinutes()/5)*5;
  return { h: p2(d.getHours()), m: p2(m >= 60 ? 0 : m) };
}
function isToday(dt) { return dt && dt.startsWith(todayStr()); }
function isOverdue(dt) {
  if (!dt) return false;
  return new Date(dt) < new Date();
}
function fmtDT(dt) {
  if (!dt) return '';
  const d = new Date(dt);
  const today = todayStr(), dtDate = dt.slice(0,10);
  const hasTime = dt.includes('T') && dt.length > 10;
  const timePart = hasTime ? ` ${p2(d.getHours())}:${p2(d.getMinutes())}` : '';
  const diff = Math.round((new Date(dtDate) - new Date(today)) / 86400000);
  let datePart;
  if (diff === 0) datePart = '今天';
  else if (diff === 1) datePart = '明天';
  else if (diff === -1) datePart = '昨天';
  else if (d.getFullYear() === new Date().getFullYear()) datePart = `${d.getMonth()+1}月${d.getDate()}日`;
  else datePart = dt.slice(0,10);
  return datePart + timePart;
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function linkify(text) {
  if(!text) return '';
  // 先 escHtml，再替换 URL 为链接
  const escaped = escHtml(text);
  return escaped.replace(/(https?:\/\/[^\s<>"]+)/g, (url) => {
    // 判断是否学城链接
    const isKM = url.includes('km.sankuai.com') || url.includes('sankuai.com');
    const label = isKM ? '📄 ' + url.replace(/^https?:\/\//,'').split('/')[0] + '…' : url.length > 40 ? url.slice(0,40)+'…' : url;
    return `<a href="${url}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;font-size:inherit" onmouseenter="this.style.textDecoration='underline'" onmouseleave="this.style.textDecoration='none'" onclick="event.stopPropagation()">${label}</a>`;
  });
}
function buildDTValue(date, h, m) {
  if (!date) return '';
  if (!h) return date;
  return `${date}T${h}:${m||'00'}`;
}

function toggleTask(id) {
  const t = tasks.find(t => t.id == id);

  t.done = !t.done;
  // 如果是循环任务，完成后生成下一次
  if (t.done && t.repeat && t.repeat !== 'none' && t.dt) {
    const nextDt = calcNextRepeat(t.dt, t.repeat);
    if (nextDt) {
      tasks.push({
